<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prode Mundial 2026</title>

<!-- Firebase SDK v9 (stable) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f5f5f2; min-height: 100vh; color: #111; }
#app { max-width: 460px; margin: 0 auto; padding-bottom: 48px; }

/* ── Typography ── */
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
h3 { font-size: 15px; font-weight: 600; }
p  { font-size: 14px; color: #666; line-height: 1.55; }

/* ── Inputs ── */
input {
  display: block; width: 100%;
  padding: 11px 13px;
  border: 1.5px solid #e0e0de;
  border-radius: 11px;
  font-size: 14px; font-family: inherit;
  background: #fff; color: #111;
  outline: none; transition: border-color 0.15s;
}
input:focus { border-color: #111; }
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
input[type=number] { -moz-appearance: textfield; }
.inp-sm { padding: 6px 8px; font-size: 13px; border-radius: 9px; text-align: center; }

/* ── Buttons ── */
button {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 11px 18px;
  border: 1.5px solid #e0e0de;
  border-radius: 12px;
  font-size: 14px; font-weight: 500; font-family: inherit;
  background: #fff; color: #111; cursor: pointer;
  transition: background 0.12s, transform 0.1s;
  user-select: none;
}
button:hover { background: #f0f0ee; }
button:active { transform: scale(0.98); }
button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn-dark { background: #111; color: #fff; border-color: #111; }
.btn-dark:hover { background: #2a2a2a; }
.btn-full { width: 100%; }
.btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 9px; }

/* ── Match result buttons ── */
.r-btn {
  width: 36px; height: 36px;
  border-radius: 9px; border: 1.5px solid #e0e0de;
  background: #fff; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.12s;
}
.r-btn:hover { background: #f5f5f3; }
.r-btn.on { background: #111; color: #fff; border-color: #111; }

/* ── Layout helpers ── */
.page   { padding: 20px 16px; }
.card   { background: #fff; border: 1.5px solid #e8e8e6; border-radius: 16px; padding: 14px 16px; }
.panel  { background: #eeeeeb; border-radius: 13px; padding: 13px 15px; }
.row    { display: flex; align-items: center; gap: 10px; }
.lbl    { font-size: 11px; color: #999; letter-spacing: 0.5px; margin-bottom: 5px; text-transform: uppercase; }
.divider { height: 1px; background: #f0f0ee; margin: 10px 0; }
.progress { height: 3px; background: #e0e0de; border-radius: 2px; margin-bottom: 16px; overflow: hidden; }
.progress-fill { height: 100%; background: #111; border-radius: 2px; transition: width 0.3s ease; }

/* ── Feedback ── */
.err { font-size: 12px; color: #dc2626; margin-top: 6px; min-height: 16px; }
.ok  { font-size: 12px; color: #16a34a; text-align: center; margin-bottom: 8px; }
.warn-box {
  background: #fef2f2; border: 1.5px solid #fecaca;
  border-radius: 12px; padding: 12px 14px;
  font-size: 13px; color: #dc2626; margin-bottom: 14px;
}
.badge { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 5px; font-weight: 700; background: #f0f0ee; color: #555; min-width: 20px; text-align: center; }

/* ── Misc ── */
.back { background: none; border: none; font-size: 13px; color: #999; cursor: pointer; padding: 0 0 14px; display: flex; align-items: center; gap: 5px; font-family: inherit; font-weight: 500; }
.back:hover { color: #111; background: none; transform: none; }
.spinner { text-align: center; padding: 48px 16px; font-size: 14px; color: #aaa; }
.scroll-box { max-height: 220px; overflow-y: auto; }
.tab-grid { display: grid; gap: 6px; margin-bottom: 16px; }
.tab { font-size: 12px; padding: 9px; border-radius: 9px; }
.tab.on { background: #111; color: #fff; border-color: #111; }
</style>
</head>
<body>

<div id="app"><div class="spinner">Cargando prode...</div></div>

<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║  CONFIGURACIÓN  —  completá con tus datos de Firebase       ║
// ╚══════════════════════════════════════════════════════════════╝
const FIREBASE_CONFIG = {
  apiKey:            "PEGAR_API_KEY_ACA",
  authDomain:        "PEGAR_AUTH_DOMAIN_ACA",
  projectId:         "PEGAR_PROJECT_ID_ACA",
  storageBucket:     "PEGAR_STORAGE_BUCKET_ACA",
  messagingSenderId: "PEGAR_MESSAGING_SENDER_ID_ACA",
  appId:             "PEGAR_APP_ID_ACA"
};

// Contraseña para el panel de admin (cambiala)
const ADMIN_PASS = "Mundial2026!";

// ╔══════════════════════════════════════════════════════════════╗
// ║  REGLAS DE FIRESTORE recomendadas (pegá en Firebase Console)║
// ║                                                             ║
// ║  rules_version = '2';                                       ║
// ║  service cloud.firestore {                                  ║
// ║    match /databases/{database}/documents {                  ║
// ║      match /{document=**} {                                 ║
// ║        allow read: if true;                                 ║
// ║        allow write: if true;                                ║
// ║      }                                                      ║
// ║    }                                                        ║
// ║  }                                                          ║
// ╚══════════════════════════════════════════════════════════════╝

// ─── Constantes ───────────────────────────────────────────────
const GROUPS = ['A','B','C','D','E','F','G','H','I','J','K','L'];
// Pares de partidos por fecha dentro de cada grupo (4 equipos, 6 partidos)
// Fecha 1: 1v2, 3v4 | Fecha 2: 1v3, 2v4 | Fecha 3: 1v4, 2v3
const PAIRS  = [[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]];
const MEDALS = ['🥇','🥈','🥉'];

// ─── Firebase ─────────────────────────────────────────────────
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

// ─── Estado global ────────────────────────────────────────────
const S = {
  // Navegación
  view: 'home',
  step: 'name',   // name | groups | finals | confirm | done
  gi: 0,          // grupo actual (0–11)
  // Usuario
  user: null,
  nameVal: '', nameErr: '',
  pred: emptyPred(),
  // Datos compartidos (Firebase)
  setup: null,    // { groups: { A:['','','',''], B:[], ... } }
  parts: [],      // [{ name, slug, submittedAt }]
  res:   {},      // { A_0:{hg,ag,r}, ..., finals:{...} }
  // Admin
  adminAuth: false,
  adminTab: 'setup',
  adminMsg: '',
  saving: false,
  adminErr: '',
  ls: null, lr: null,  // copias locales para edición admin
};

function emptyPred() {
  return { gm: {}, fin: { ch:'', ru:'', tp:'', fp:'', ts:'', bp:'', as:'', mg:'' } };
}

// ─── Utilidades ───────────────────────────────────────────────
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const slugify = n => n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
const initSetup = () => ({ groups: Object.fromEntries(GROUPS.map(g => [g, ['','','','']])) });

// ─── Cálculo de puntaje ───────────────────────────────────────
function calcScore(pred, res) {
  let s = 0;
  GROUPS.forEach(g => PAIRS.forEach(([,], mi) => {
    const id = `${g}_${mi}`, p = pred?.gm?.[id], r = res?.[id];
    if (!p?.r || !r?.r) return;
    const hg = parseInt(p.hg), ag = parseInt(p.ag);
    if (!isNaN(hg) && !isNaN(ag) && hg === r.hg && ag === r.ag) s += 5; // exacto
    else if (p.r === r.r) s += 2; // resultado
  }));
  const fp = pred?.fin || {}, rf = res?.finals || {};
  const eq = (a, b) => a && b && a.trim().toLowerCase() === b.trim().toLowerCase();
  if (eq(fp.ch, rf.ch)) s += 10;
  if (eq(fp.ru, rf.ru)) s += 6;
  if (eq(fp.tp, rf.tp)) s += 4;
  if (eq(fp.fp, rf.fp)) s += 2;
  if (eq(fp.ts, rf.ts)) s += 8;
  if (eq(fp.bp, rf.bp)) s += 5;
  if (eq(fp.as, rf.as)) s += 5;
  if (rf.mg !== undefined && rf.mg !== '' && fp.mg !== '' && fp.mg !== undefined) {
    const d = Math.abs(parseInt(fp.mg) - parseInt(rf.mg));
    if (d === 0) s += 5; else if (d <= 2) s += 2;
  }
  return s;
}

// ─── Render principal ─────────────────────────────────────────
const app = document.getElementById('app');

function render() {
  if      (S.view === 'home')        app.innerHTML = viewHome();
  else if (S.view === 'prode')       app.innerHTML = viewProde();
  else if (S.view === 'leaderboard') { app.innerHTML = viewLeaderboard(); loadRanking(); }
  else if (S.view === 'admin')       { app.innerHTML = viewAdmin(); if (S.adminTab === 'stats') loadChampStats(); }
}
function go(v) { S.view = v; render(); }

// ══════════════════════════════════════════════════════════════
// VISTA: HOME
// ══════════════════════════════════════════════════════════════
function viewHome() {
  const played = Object.keys(S.res).filter(k => k.includes('_') && S.res[k]?.r).length;
  return `
<div class="page">
  <div style="text-align:center;padding:28px 0 22px">
    <div style="font-size:10px;color:#aaa;letter-spacing:3px;margin-bottom:7px">FIFA WORLD CUP 2026</div>
    <h1 style="font-size:30px;margin-bottom:6px">Prode Mundial</h1>
    <div style="font-size:13px;color:#aaa">
      ${S.parts.length} participante${S.parts.length !== 1 ? 's' : ''}${played > 0 ? ` · ${played} partidos jugados` : ''}
    </div>
  </div>

  <div class="panel" style="margin-bottom:14px">
    <div class="lbl">Sistema de puntaje</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;margin-top:8px">
      ${[['Resultado (1/X/2)','2 pts'],['Resultado exacto','5 pts'],['Campeón','10 pts'],['Goleador torneo','8 pts'],['Subcampeón','6 pts'],['Mejor jugador','5 pts'],['3° Puesto','4 pts'],['Goles Messi exacto','5 pts'],['4° Puesto','2 pts'],['Goles Messi ±2','2 pts']].map(([l,v]) => `
      <div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0">
        <span style="color:#666">${l}</span><strong>${v}</strong>
      </div>`).join('')}
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:9px">
    <button class="btn-dark btn-full" style="padding:15px;font-size:15px" onclick="go('prode')">⚽ Cargar mi prode</button>
    <button class="btn-full" style="padding:15px;font-size:15px" onclick="go('leaderboard')">🏆 Ver tabla de posiciones</button>
    <button class="btn-full" style="padding:12px;font-size:13px;color:#999" onclick="go('admin')">🔐 Admin</button>
  </div>
</div>`;
}

// ══════════════════════════════════════════════════════════════
// VISTA: PRODE (multi-paso)
// ══════════════════════════════════════════════════════════════
function viewProde() {
  if (S.step === 'name')    return stepName();
  if (S.step === 'groups')  return stepGroups();
  if (S.step === 'finals')  return stepFinals();
  if (S.step === 'confirm') return stepConfirm();
  if (S.step === 'done')    return stepDone();
  return '';
}

// ── Paso 1: Nombre ────────────────────────────────────────────
function stepName() {
  return `
<div class="page">
  <button class="back" onclick="go('home')">← Inicio</button>
  <h2 style="margin-bottom:5px">Tu prode</h2>
  <p style="margin-bottom:18px">Ingresá tu nombre completo. Una vez confirmado, no podés modificar tus predicciones.</p>
  <div class="lbl">Nombre y apellido</div>
  <input type="text" id="nameInp" placeholder="Ej: Juan Pérez" value="${esc(S.nameVal)}"
    oninput="S.nameVal=this.value"
    onkeydown="if(event.key==='Enter')doName()">
  <div class="err">${S.nameErr}</div>
  <button class="btn-dark btn-full" style="margin-top:14px;padding:13px" onclick="doName()">Continuar →</button>
</div>`;
}

function doName() {
  const n = S.nameVal.trim();
  if (!n) { S.nameErr = 'Ingresá tu nombre y apellido.'; render(); return; }
  const sl = slugify(n);
  if (S.parts.find(p => p.slug === sl)) {
    S.nameErr = 'Este nombre ya tiene un prode cargado. No se puede modificar.';
    render(); return;
  }
  S.user = { name: n, slug: sl };
  S.nameErr = ''; S.step = 'groups'; S.gi = 0; render();
}

// ── Paso 2: Grupos ────────────────────────────────────────────
function stepGroups() {
  const gi = S.gi, g = GROUPS[gi];
  const teams = S.setup?.groups?.[g] || ['','','',''];
  const tn = i => teams[i] || `Equipo ${i + 1}`;
  const pct = Math.round((gi / 12) * 100);
  const filled = GROUPS.reduce((a, gr) => a + PAIRS.filter((_, mi) => S.pred.gm[`${gr}_${mi}`]?.r).length, 0);

  const matchRows = PAIRS.map(([hi, ai], mi) => {
    const id = `${g}_${mi}`, mp = S.pred.gm[id] || {};
    const scoreRow = mp.r ? `
      <div style="border-top:1px solid #f0f0ee;margin-top:8px;padding-top:8px;display:flex;align-items:center;gap:8px;justify-content:center">
        <span style="font-size:11px;color:#aaa">Resultado exacto (+3&nbsp;pts)</span>
        <input type="number" class="inp-sm" min="0" max="20" placeholder="-" value="${mp.hg ?? ''}" style="width:38px"
          oninput="setPred('${id}','hg',this.value)">
        <span style="color:#ccc;font-size:13px">–</span>
        <input type="number" class="inp-sm" min="0" max="20" placeholder="-" value="${mp.ag ?? ''}" style="width:38px"
          oninput="setPred('${id}','ag',this.value)">
      </div>` : '';
    return `
    <div class="card" style="margin-bottom:8px">
      <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center">
        <div style="text-align:right;font-size:13px;font-weight:${mp.r==='1'?700:400};color:${mp.r==='1'?'#111':'#777'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(tn(hi))}</div>
        <div style="display:flex;gap:4px">
          ${['1','X','2'].map(opt => `<button class="r-btn${mp.r===opt?' on':''}" onclick="clickResult('${id}','${opt}')">${opt}</button>`).join('')}
        </div>
        <div style="font-size:13px;font-weight:${mp.r==='2'?700:400};color:${mp.r==='2'?'#111':'#777'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(tn(ai))}</div>
      </div>
      ${scoreRow}
    </div>`;
  }).join('');

  return `
<div class="page">
  <div class="row" style="margin-bottom:10px">
    <button class="back" style="padding:0;margin:0" onclick="${gi > 0 ? 'S.gi--;' : "S.step='name';"}render()">← </button>
    <div style="flex:1">
      <div style="font-size:15px;font-weight:700">Grupo ${g}</div>
      <div style="font-size:11px;color:#aaa">Grupo ${gi + 1} de 12 · ${filled}/72 completados</div>
    </div>
    <span style="font-size:13px;color:#aaa">${pct}%</span>
  </div>
  <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>

  <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-bottom:6px">
    <div style="font-size:10px;color:#ccc;text-align:right">Local</div>
    <div style="font-size:10px;color:#ccc;text-align:center;min-width:116px">1 — X — 2</div>
    <div style="font-size:10px;color:#ccc">Visitante</div>
  </div>

  ${matchRows}

  <button class="btn-dark btn-full" style="margin-top:6px;padding:13px"
    onclick="${gi < 11 ? 'S.gi++;render()' : "S.step='finals';render()"}">
    ${gi < 11 ? `Grupo ${GROUPS[gi + 1]} →` : 'Predicciones finales →'}
  </button>
</div>`;
}

function clickResult(id, opt) {
  if (!S.pred.gm[id]) S.pred.gm[id] = {};
  S.pred.gm[id].r = S.pred.gm[id].r === opt ? null : opt;
  const sy = window.scrollY;
  render();
  requestAnimationFrame(() => window.scrollTo(0, sy));
}
function setPred(id, field, val) {
  if (!S.pred.gm[id]) S.pred.gm[id] = {};
  S.pred.gm[id][field] = val === '' ? null : val;
}

// ── Paso 3: Predicciones finales ──────────────────────────────
function stepFinals() {
  const fp = S.pred.fin;
  const fld = (label, key, type, hint) => `
    <div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <div class="lbl" style="margin:0">${label}</div>
        ${hint ? `<span style="font-size:10px;color:#bbb">${hint}</span>` : ''}
      </div>
      <input type="${type || 'text'}" value="${esc(fp[key] || '')}" oninput="S.pred.fin['${key}']=this.value">
    </div>`;
  return `
<div class="page">
  <button class="back" onclick="S.step='groups';render()">← Volver a grupos</button>
  <h2 style="margin-bottom:5px">Predicciones finales</h2>
  <p style="margin-bottom:16px">Los puntos más valiosos del prode.</p>

  <div class="panel" style="margin-bottom:12px">
    <div class="lbl" style="margin-bottom:10px">Resultados finales</div>
    ${fld('Campeón','ch','text','10 pts')}
    ${fld('Subcampeón','ru','text','6 pts')}
    ${fld('3° Puesto','tp','text','4 pts')}
    ${fld('4° Puesto','fp','text','2 pts')}
  </div>

  <div class="panel" style="margin-bottom:16px">
    <div class="lbl" style="margin-bottom:10px">Otras predicciones</div>
    ${fld('Goleador del torneo','ts','text','8 pts')}
    ${fld('Mejor jugador del torneo','bp','text','5 pts')}
    ${fld('Goleador de Argentina','as','text','5 pts')}
    ${fld('¿Cuántos goles hace Messi?','mg','number','5 pts exacto · 2 pts si ±2')}
  </div>

  <button class="btn-dark btn-full" style="padding:13px" onclick="S.step='confirm';render()">Revisar y confirmar →</button>
</div>`;
}

// ── Paso 4: Confirmar ─────────────────────────────────────────
function stepConfirm() {
  const filled = Object.values(S.pred.gm).filter(m => m?.r).length;
  const fp = S.pred.fin;
  return `
<div class="page">
  <button class="back" onclick="S.step='finals';render()">← Volver</button>
  <h2 style="margin-bottom:14px">Confirmar prode</h2>

  <div class="warn-box">
    <strong>⚠ Acción irreversible</strong><br>
    Una vez confirmado, tu prode queda bloqueado y no se puede modificar.
  </div>

  <div class="panel" style="margin-bottom:14px">
    <div class="lbl">Nombre</div>
    <div style="font-size:16px;font-weight:700;margin-bottom:14px">${esc(S.user?.name || '')}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      ${[['Partidos completados',`${filled}/72`],['Campeón',fp.ch||'—'],['Goleador',fp.ts||'—'],['Goles Messi',fp.mg!==''?fp.mg:'—']].map(([l,v]) => `
      <div class="card" style="padding:10px 12px">
        <div class="lbl">${l}</div>
        <div style="font-size:13px;font-weight:700">${esc(String(v))}</div>
      </div>`).join('')}
    </div>
  </div>

  <button class="btn-dark btn-full" style="padding:13px" ${S.saving ? 'disabled' : ''} onclick="submitProde()">
    ${S.saving ? 'Guardando...' : '✓ Confirmar y bloquear prode'}
  </button>
</div>`;
}

async function submitProde() {
  if (S.saving) return;
  S.saving = true; render();
  try {
    const sl = S.user.slug;
    const data = { ...S.pred, name: S.user.name, submittedAt: new Date().toISOString() };
    await db.doc(`predictions/${sl}`).set(data);
    await db.doc(`participants/${sl}`).set({ name: S.user.name, slug: sl, submittedAt: new Date().toISOString() });
    S.parts.push({ name: S.user.name, slug: sl, submittedAt: new Date().toISOString() });
    S.saving = false; S.step = 'done'; render();
  } catch (e) {
    S.saving = false;
    alert('Error al guardar. Verificá tu conexión e intentá de nuevo.');
    render();
  }
}

// ── Paso 5: Hecho ─────────────────────────────────────────────
function stepDone() {
  return `
<div class="page" style="text-align:center;padding-top:60px">
  <div style="font-size:60px;margin-bottom:18px">🎉</div>
  <h2 style="margin-bottom:8px">¡Prode guardado!</h2>
  <p style="margin-bottom:6px;font-size:15px;font-weight:600;color:#111">${esc(S.user?.name)}</p>
  <p style="margin-bottom:30px;font-size:12px">Tus predicciones fueron registradas y no se pueden modificar.</p>
  <div style="display:flex;flex-direction:column;gap:8px">
    <button class="btn-full" style="padding:13px" onclick="go('leaderboard')">Ver tabla de posiciones →</button>
    <button class="btn-full" style="padding:13px;color:#999" onclick="resetProde()">Volver al inicio</button>
  </div>
</div>`;
}
function resetProde() { S.step = 'name'; S.nameVal = ''; S.pred = emptyPred(); S.user = null; go('home'); }

// ══════════════════════════════════════════════════════════════
// VISTA: TABLA DE POSICIONES
// ══════════════════════════════════════════════════════════════
function viewLeaderboard() {
  return `
<div class="page">
  <div class="row" style="margin-bottom:16px">
    <button class="back" style="padding:0;margin:0" onclick="go('home')">← </button>
    <div style="flex:1">
      <h2 style="margin-bottom:2px">Tabla de posiciones</h2>
      <div id="rankMeta" style="font-size:11px;color:#aaa">${S.parts.length} participantes</div>
    </div>
    <button class="btn-sm" onclick="loadRanking()">↻ Actualizar</button>
  </div>
  <div id="rankList"><div class="spinner">Calculando puntajes...</div></div>
</div>`;
}

async function loadRanking() {
  const el = document.getElementById('rankList');
  if (!el) return;
  el.innerHTML = '<div class="spinner">Calculando...</div>';
  try {
    const [partsSnap, resDoc, predSnap] = await Promise.all([
      db.collection('participants').get(),
      db.doc('results/official').get(),
      db.collection('predictions').get()
    ]);
    S.parts = partsSnap.docs.map(d => d.data()).sort((a,b) => new Date(a.submittedAt) - new Date(b.submittedAt));
    if (resDoc.exists) S.res = resDoc.data();
    const predMap = {};
    predSnap.docs.forEach(d => predMap[d.id] = d.data());
    const arr = S.parts.map(p => ({
      ...p,
      sc: calcScore(predMap[p.slug], S.res),
      ch: predMap[p.slug]?.fin?.ch
    })).sort((a,b) => b.sc - a.sc);

    const meta = document.getElementById('rankMeta');
    if (meta) meta.textContent = `${S.parts.length} participantes`;

    if (!arr.length) {
      el.innerHTML = '<div class="spinner">Aún no hay participantes.</div>';
      return;
    }

    // Matches played count
    const played = Object.keys(S.res).filter(k => k.includes('_') && S.res[k]?.r).length;

    el.innerHTML = `
      <div style="font-size:11px;color:#aaa;margin-bottom:12px;text-align:center">${played} partidos jugados</div>
      ${arr.map((s, i) => `
      <div class="card" style="display:flex;align-items:center;gap:12px;margin-bottom:8px${i===0?';border-color:#d4af37':''}"">
        <div style="font-size:${i<3?20:14}px;min-width:28px;text-align:center;font-weight:700">${MEDALS[i] ?? (i+1)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.name)}</div>
          ${s.ch ? `<div style="font-size:11px;color:#aaa;margin-top:2px">⚽ ${esc(s.ch)}</div>` : ''}
        </div>
        <div style="text-align:right">
          <div style="font-size:22px;font-weight:800;${i===0?'color:#b8860b':''}">${s.sc}</div>
          <div style="font-size:10px;color:#aaa">pts</div>
        </div>
      </div>`).join('')}`;
  } catch (e) {
    const el2 = document.getElementById('rankList');
    if (el2) el2.innerHTML = '<div class="spinner">Error al cargar. Intentá de nuevo.</div>';
  }
}

// ══════════════════════════════════════════════════════════════
// VISTA: ADMIN
// ══════════════════════════════════════════════════════════════
function viewAdmin() {
  if (!S.adminAuth) return viewAdminLogin();
  const tabs = [['setup','⚙ Equipos'],['results','⚽ Resultados'],['stats','📊 Stats']];
  return `
<div class="page">
  <div class="row" style="margin-bottom:14px">
    <button class="back" style="padding:0;margin:0" onclick="go('home')">← </button>
    <h2 style="flex:1">Admin</h2>
    <span style="font-size:11px;color:#aaa">${S.parts.length} participantes</span>
  </div>
  <div class="tab-grid" style="grid-template-columns:repeat(3,1fr)">
    ${tabs.map(([t,l]) => `<button class="btn tab${S.adminTab===t?' on':''}" onclick="S.adminTab='${t}';render()">${l}</button>`).join('')}
  </div>
  ${S.adminTab === 'setup'   ? tabSetup()   : ''}
  ${S.adminTab === 'results' ? tabResults() : ''}
  ${S.adminTab === 'stats'   ? tabStats()   : ''}
</div>`;
}

function viewAdminLogin() {
  return `
<div class="page">
  <button class="back" onclick="go('home')">← Inicio</button>
  <h2 style="margin-bottom:5px">Admin</h2>
  <p style="margin-bottom:16px">Ingresá la contraseña para acceder.</p>
  <input type="password" id="adminPwd" placeholder="Contraseña"
    onkeydown="if(event.key==='Enter')doAdminLogin()">
  <div class="err">${S.adminErr}</div>
  <button class="btn-dark btn-full" style="margin-top:12px;padding:13px" onclick="doAdminLogin()">Ingresar</button>
  <div style="margin-top:14px;font-size:11px;color:#ccc;text-align:center">Contraseña por defecto: ${esc(ADMIN_PASS)}</div>
</div>`;
}

function doAdminLogin() {
  const p = document.getElementById('adminPwd')?.value || '';
  if (p === ADMIN_PASS) {
    S.adminAuth = true; S.adminErr = '';
    S.ls = JSON.parse(JSON.stringify(S.setup));
    S.lr = JSON.parse(JSON.stringify(S.res));
    render();
  } else {
    S.adminErr = 'Contraseña incorrecta.'; render();
  }
}

// ── Tab Equipos ───────────────────────────────────────────────
function tabSetup() {
  const ls = S.ls;
  return `
<div>
  <p style="margin-bottom:12px;font-size:12px">Ingresá los 4 equipos de cada grupo según el sorteo oficial (de 1 a 4).</p>
  ${GROUPS.map(g => `
  <div class="panel" style="margin-bottom:8px">
    <h3 style="margin-bottom:8px">Grupo ${g}</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
      ${[0,1,2,3].map(i => `
      <input type="text" placeholder="Equipo ${i+1}" value="${esc(ls.groups[g]?.[i] || '')}"
        oninput="S.ls.groups['${g}'][${i}]=this.value" style="font-size:12px;padding:7px 10px">`).join('')}
    </div>
  </div>`).join('')}
  ${saveBtnHtml()}
</div>`;
}

// ── Tab Resultados ────────────────────────────────────────────
function tabResults() {
  const ls = S.ls, lr = S.lr;
  const tn = (g, i) => ls.groups[g]?.[i] || `Eq${i+1}`;
  return `
<div>
  <p style="margin-bottom:12px;font-size:12px">Ingresá los goles de cada partido. El resultado (1/X/2) se calcula automáticamente.</p>
  ${GROUPS.map(g => `
  <div class="panel" style="margin-bottom:8px">
    <h3 style="margin-bottom:9px">Grupo ${g}</h3>
    ${PAIRS.map(([hi, ai], mi) => {
      const id = `${g}_${mi}`, r = lr[id] || {};
      return `
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:9px">
      <span style="flex:1;text-align:right;font-size:12px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(tn(g, hi))}</span>
      <input type="number" class="inp-sm" min="0" max="20" value="${r.hg ?? ''}" placeholder="-" style="width:36px"
        oninput="upRes('${id}','hg',this.value)">
      <span style="color:#ddd">–</span>
      <input type="number" class="inp-sm" min="0" max="20" value="${r.ag ?? ''}" placeholder="-" style="width:36px"
        oninput="upRes('${id}','ag',this.value)">
      <span style="flex:1;font-size:12px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(tn(g, ai))}</span>
      <span class="badge" id="badge_${id}" style="min-width:22px">${r.r || ''}</span>
    </div>`;}).join('')}
  </div>`).join('')}

  <div class="panel" style="margin-bottom:12px">
    <h3 style="margin-bottom:10px">Resultados finales</h3>
    ${[['ch','Campeón'],['ru','Subcampeón'],['tp','3° Puesto'],['fp','4° Puesto'],['ts','Goleador del torneo'],['bp','Mejor jugador'],['as','Goleador Argentina'],['mg','Goles de Messi']].map(([k,l]) => `
    <div style="margin-bottom:10px">
      <div class="lbl">${l}</div>
      <input type="${k==='mg'?'number':'text'}" value="${esc(String((lr.finals||{})[k] ?? ''))}"
        oninput="if(!S.lr.finals)S.lr.finals={};S.lr.finals['${k}']=this.value" style="font-size:13px;padding:9px 11px">
    </div>`).join('')}
  </div>
  ${saveBtnHtml()}
</div>`;
}

function upRes(id, field, val) {
  if (!S.lr[id]) S.lr[id] = {};
  S.lr[id][field] = val === '' ? null : val;
  const h = parseInt(S.lr[id].hg), a = parseInt(S.lr[id].ag);
  S.lr[id].r = (!isNaN(h) && !isNaN(a)) ? (h > a ? '1' : h < a ? '2' : 'X') : null;
  const badge = document.getElementById(`badge_${id}`);
  if (badge) badge.textContent = S.lr[id].r || '';
}

function saveBtnHtml() {
  return `
<div style="margin-top:12px">
  ${S.adminMsg ? `<div class="${S.adminMsg.includes('Error') ? 'err' : 'ok'}" style="text-align:center;margin-bottom:8px">${S.adminMsg}</div>` : ''}
  <button class="btn-dark btn-full" style="padding:13px" ${S.saving ? 'disabled' : ''} onclick="saveAdmin()">
    ${S.saving ? 'Guardando...' : 'Guardar cambios'}
  </button>
</div>`;
}

async function saveAdmin() {
  if (S.saving) return;
  S.saving = true; render();
  try {
    await db.doc('config/setup').set(S.ls);
    S.setup = JSON.parse(JSON.stringify(S.ls));
    await db.doc('results/official').set(S.lr);
    S.res = JSON.parse(JSON.stringify(S.lr));
    S.adminMsg = '✓ Cambios guardados correctamente.';
  } catch (e) {
    S.adminMsg = 'Error al guardar. Revisá la conexión.';
  }
  S.saving = false;
  setTimeout(() => { S.adminMsg = ''; render(); }, 3000);
  render();
}

// ── Tab Stats ─────────────────────────────────────────────────
function tabStats() {
  return `
<div>
  <div class="panel" style="margin-bottom:10px">
    <h3 style="margin-bottom:10px">Participantes (${S.parts.length})</h3>
    ${S.parts.length === 0 ? '<p style="font-size:12px">Sin participantes aún.</p>' : `
    <div class="scroll-box">
      ${S.parts.map((p,i) => `
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0ee;font-size:12px">
        <span>${i+1}. ${esc(p.name)}</span>
        <span style="color:#aaa;font-size:10px">${new Date(p.submittedAt).toLocaleDateString('es-AR')}</span>
      </div>`).join('')}
    </div>`}
  </div>
  <div class="panel">
    <h3 style="margin-bottom:10px">Campeones más elegidos</h3>
    <div id="champStats"><div style="font-size:12px;color:#aaa">Cargando...</div></div>
  </div>
</div>`;
}

async function loadChampStats() {
  const el = document.getElementById('champStats');
  if (!el) return;
  try {
    const snap = await db.collection('predictions').get();
    const counts = {};
    snap.docs.forEach(d => {
      const ch = d.data().fin?.ch?.trim();
      if (ch) counts[ch] = (counts[ch] || 0) + 1;
    });
    const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
    if (!sorted.length) { el.innerHTML = '<div style="font-size:12px;color:#aaa">Sin datos aún.</div>'; return; }
    const max = sorted[0][1];
    el.innerHTML = sorted.slice(0, 12).map(([team, count]) => `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
      <span style="flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(team)}</span>
      <div style="width:70px;height:5px;background:#e8e8e6;border-radius:3px">
        <div style="height:100%;width:${Math.round((count/max)*100)}%;background:#111;border-radius:3px"></div>
      </div>
      <span style="font-size:11px;color:#666;min-width:18px;text-align:right">${count}</span>
    </div>`).join('');
  } catch { el.innerHTML = '<div style="font-size:12px;color:#aaa">Error al cargar.</div>'; }
}

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════
async function init() {
  try {
    const [setupDoc, partsSnap, resDoc] = await Promise.all([
      db.doc('config/setup').get(),
      db.collection('participants').get(),
      db.doc('results/official').get()
    ]);
    S.setup = setupDoc.exists ? setupDoc.data() : initSetup();
    S.parts = partsSnap.docs.map(d => d.data()).sort((a,b) => new Date(a.submittedAt) - new Date(b.submittedAt));
    S.res   = resDoc.exists ? resDoc.data() : {};
  } catch (e) {
    console.error('Error conectando con Firebase:', e);
    app.innerHTML = `
      <div class="page" style="text-align:center;padding-top:60px">
        <div style="font-size:40px;margin-bottom:16px">⚠️</div>
        <h2 style="margin-bottom:8px">Error de conexión</h2>
        <p>Verificá que la configuración de Firebase sea correcta y que las reglas de Firestore permitan el acceso.</p>
      </div>`;
    return;
  }
  render();
}

init();
</script>
