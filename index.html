<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prode Mundial 2026</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
html,body{background:#080d24;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;margin:0;padding:0}
*{box-sizing:border-box;margin:0;padding:0}
#app{max-width:460px;margin:0 auto;padding-bottom:60px}
h1,h2,h3{color:#fff}
h2{font-size:20px;font-weight:700}
h3{font-size:15px;font-weight:600}
p{font-size:14px;color:#8899cc;line-height:1.55}
input,select{display:block;width:100%;padding:11px 13px;border:1.5px solid #1e2d5e;border-radius:11px;font-size:14px;font-family:inherit;background:#111d45;color:#fff;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:#2979ff}
input::placeholder{color:#8899cc}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
button{display:inline-flex;align-items:center;justify-content:center;padding:11px 18px;border:1.5px solid #1e2d5e;border-radius:12px;font-size:14px;font-weight:500;font-family:inherit;background:#0f1840;color:#fff;cursor:pointer;transition:background .12s;user-select:none}
button:hover{background:#1a2a5e;border-color:#2979ff}
button:active{transform:scale(.98)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:#2979ff;color:#fff;border-color:#2979ff}
.btn-primary:hover{background:#1a56db;border-color:#1a56db}
.btn-full{width:100%}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:9px}
.btn-danger{background:rgba(248,113,113,.1);color:#f87171;border-color:rgba(248,113,113,.3)}
.btn-danger:hover{background:rgba(248,113,113,.2)}
.btn-success{background:rgba(34,197,94,.1);color:#22c55e;border-color:rgba(34,197,94,.3)}
.page{padding:20px 16px}
.card{background:#0f1840;border:1.5px solid #1e2d5e;border-radius:16px;padding:14px 16px}
.panel{background:#0d1535;border:1px solid #1e2d5e;border-radius:13px;padding:13px 15px}
.row{display:flex;align-items:center;gap:10px}
.lbl{font-size:11px;color:#8899cc;letter-spacing:.5px;margin-bottom:5px;text-transform:uppercase}
.err{font-size:12px;color:#f87171;margin-top:6px;min-height:16px}
.ok{font-size:12px;color:#22c55e}
.back{background:none;border:none;font-size:13px;color:#8899cc;cursor:pointer;padding:0 0 14px;display:flex;align-items:center;gap:5px;font-family:inherit;font-weight:500}
.back:hover{color:#fff;background:none;transform:none}
.spinner{text-align:center;padding:48px 16px;font-size:14px;color:#8899cc}
.header-stripe{background:linear-gradient(135deg,#080d24 0%,#0d1a4a 60%,#0a1533 100%);border-bottom:1px solid #1e2d5e;padding:24px 20px 20px;text-align:center}
.logo-img{width:72px;height:72px;border-radius:50%;margin-bottom:10px;border:2px solid #2979ff;box-shadow:0 0 20px rgba(41,121,255,.4)}
.section-title{font-size:11px;font-weight:700;color:#2979ff;margin:14px 0 8px;text-transform:uppercase;letter-spacing:.5px}
.podium-slot{background:#0f1840;border:1.5px solid #1e2d5e;border-radius:11px;padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px;min-height:48px;transition:border-color .15s}
.podium-slot.filled{border-color:#2979ff}
.podium-slot.empty{border-style:dashed;opacity:.6}
.team-chip{display:inline-flex;align-items:center;background:#111d45;border:1px solid #1e2d5e;border-radius:8px;padding:7px 11px;font-size:13px;font-weight:500;cursor:pointer;transition:all .12s;margin:3px}
.team-chip:hover{border-color:#2979ff;background:#1a2a5e}
.team-chip.used{opacity:.3;pointer-events:none}
.ko-card{background:#0f1840;border:1.5px solid #1e2d5e;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ko-btn{padding:5px 10px;border-radius:8px;border:1.5px solid #1e2d5e;background:#111d45;color:#8899cc;font-size:12px;font-weight:600;cursor:pointer;transition:all .12s}
.ko-btn.on{background:#2979ff;color:#fff;border-color:#2979ff}
.stage-badge{display:inline-block;font-size:10px;padding:3px 8px;border-radius:6px;font-weight:700;margin-bottom:4px}
.stage-open{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.3)}
.stage-locked{background:rgba(248,113,113,.15);color:#f87171;border:1px solid rgba(248,113,113,.3)}
.stage-pending{background:rgba(136,153,204,.1);color:#8899cc;border:1px solid #1e2d5e}
.stage-done{background:rgba(41,121,255,.15);color:#2979ff;border:1px solid rgba(41,121,255,.3)}
.toggle{width:44px;height:24px;border-radius:12px;border:none;background:#1e2d5e;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;padding:0}
.toggle.on{background:#2979ff}
.toggle::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s}
.toggle.on::after{transform:translateX(20px)}
.toggle:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>

// --- SCORING ------------------------------------------------
function calcScore(pred, res, cfg){
  let s=0;
  if(!pred||!res) return 0;

  // 1. Grupos: 1ro=3pts, 2do=2pts, 3ro=1pt
  GROUPS.forEach(g=>{
    const pp=pred.grupos?.[g]?.pos||[];
    const rp=res.grupos?.[g]?.pos||[];
    if(pp[0]&&rp[0]&&pp[0]===rp[0]) s+=3;
    if(pp[1]&&rp[1]&&pp[1]===rp[1]) s+=2;
    if(pp[2]&&rp[2]&&pp[2]===rp[2]) s+=1;
  });

  // 2. Terceros que pasan: 2pts c/u
  const rT=res.terceros||[];
  (pred.grupos?.terceros||[]).forEach(t=>{ if(t&&rT.includes(t)) s+=2; });

  // 3. Goles Argentina y Messi: exacto=3, +-1=1
  const rG=res.goles||{};
  const pG=pred.goles||{};
  Object.keys(rG).forEach(k=>{
    const rv=rG[k]; if(rv===null||rv===undefined) return;
    const pv=pG[k]; if(pv===null||pv===undefined||pv==='') return;
    const d=Math.abs(parseInt(pv)-parseInt(rv));
    if(d===0) s+=3; else if(d===1) s+=1;
  });

  // 4. KO: ganador por ronda
  const rondaPts={r16:2, r8:3, r4:4, r2:5, r3p:5, final:10};
  const resKO=res.ko||{};
  const predKO=pred.ko||{};
  Object.keys(resKO).forEach(id=>{
    const rr=resKO[id]; if(!rr?.w) return;
    const pr=predKO[id]; if(!pr?.w) return;
    const ronda=id.startsWith('r16')?'r16':id.startsWith('r8')?'r8':id.startsWith('r4')?'r4':id.startsWith('r2')?'r2':id.startsWith('r3p')?'r3p':'final';
    if(pr.w===rr.w) s+=rondaPts[ronda]||2;
  });

  return s;
}

// Detalle de puntos por participante
function calcScoreDetail(pred, res){
  const items=[];
  if(!pred||!res) return items;

  // Grupos
  GROUPS.forEach(g=>{
    const pp=pred.grupos?.[g]?.pos||[];
    const rp=res.grupos?.[g]?.pos||[];
    if(!rp[0]) return;
    if(pp[0]&&rp[0]&&pp[0]===rp[0]) items.push({cat:'Grupos', desc:'1ro Grupo '+g+': '+pp[0], pts:3, ok:true});
    else if(pp[0]) items.push({cat:'Grupos', desc:'1ro Grupo '+g+': predijo '+pp[0]+', fue '+rp[0], pts:0, ok:false});
    if(pp[1]&&rp[1]&&pp[1]===rp[1]) items.push({cat:'Grupos', desc:'2do Grupo '+g+': '+pp[1], pts:2, ok:true});
    else if(pp[1]&&rp[1]) items.push({cat:'Grupos', desc:'2do Grupo '+g+': predijo '+pp[1]+', fue '+rp[1], pts:0, ok:false});
    if(pp[2]&&rp[2]&&pp[2]===rp[2]) items.push({cat:'Grupos', desc:'3ro Grupo '+g+': '+pp[2], pts:1, ok:true});
    else if(pp[2]&&rp[2]) items.push({cat:'Grupos', desc:'3ro Grupo '+g+': predijo '+pp[2]+', fue '+rp[2], pts:0, ok:false});
  });

  // Terceros
  const rT=res.terceros||[];
  (pred.grupos?.terceros||[]).forEach(t=>{
    if(!t) return;
    const ok=rT.includes(t);
    items.push({cat:'Terceros', desc:(ok?'OK':'No') +': '+t+' pasa a 16avos', pts:ok?2:0, ok});
  });

  // Goles
  const rG=res.goles||{};
  const pG=pred.goles||{};
  const golLabels={
    arg_g1:'ARG goles vs Argelia (F1)', mes_g1:'Messi goles vs Argelia (F1)',
    arg_g2:'ARG goles vs Austria (F2)',  mes_g2:'Messi goles vs Austria (F2)',
    arg_g3:'ARG goles vs Jordania (F3)', mes_g3:'Messi goles vs Jordania (F3)',
  };
  Object.keys(rG).forEach(k=>{
    const rv=rG[k]; if(rv===null||rv===undefined) return;
    const pv=pG[k]; if(pv===null||pv===undefined||pv==='') return;
    const d=Math.abs(parseInt(pv)-parseInt(rv));
    const lbl=golLabels[k]||k;
    if(d===0) items.push({cat:'Goles', desc:lbl+': '+pv+' (exacto)', pts:3, ok:true});
    else if(d===1) items.push({cat:'Goles', desc:lbl+': predijo '+pv+', fue '+rv+' (+-1)', pts:1, ok:'partial'});
    else items.push({cat:'Goles', desc:lbl+': predijo '+pv+', fue '+rv, pts:0, ok:false});
  });

  // KO
  const rondaPts={r16:2, r8:3, r4:4, r2:5, r3p:5, final:10};
  const rondaLabel={r16:'16avos', r8:'Octavos', r4:'Cuartos', r2:'Semis', r3p:'3er puesto', final:'Final'};
  const resKO=res.ko||{};
  const predKO=pred.ko||{};
  Object.keys(resKO).forEach(id=>{
    const rr=resKO[id]; if(!rr?.w) return;
    const pr=predKO[id]; if(!pr?.w) return;
    const ronda=id.startsWith('r16')?'r16':id.startsWith('r8')?'r8':id.startsWith('r4')?'r4':id.startsWith('r2')?'r2':id.startsWith('r3p')?'r3p':'final';
    const pts=rondaPts[ronda]||2;
    const ganReal=rr.w==='h'?rr.h:rr.a;
    const ganPred=pr.w==='h'?(pr.h||rr.h):(pr.a||rr.a);
    const lbl=rondaLabel[ronda]||ronda;
    if(pr.w===rr.w) items.push({cat:'KO', desc:lbl+': '+ganReal, pts, ok:true});
    else items.push({cat:'KO', desc:lbl+': predijo '+ganPred+', gano '+ganReal, pts:0, ok:false});
  });

  return items;
}

function viewProde(){
  if(!S.user) return stepLogin();

  // Ver que etapas tiene abiertas y cuales ya completo
  const openEtapas=ETAPAS.filter(e=>etapaOpen(e.id));
  const myPred=S.pred;

  if(openEtapas.length===0){
    return `<div class="page">
      <button class="back" onclick="go('home')"><- Inicio</button>
      <div style="text-align:center;padding:40px 0">
        <div style="font-size:40px;margin-bottom:12px"></div>
        <h2 style="margin-bottom:8px">Sin etapas abiertas</h2>
        <p>El administrador aun no habilio ninguna etapa.</p>
      </div>
    </div>`;
  }

  // Mostrar selector de etapa si hay mas de una abierta
  const etapa=S.ui.etapa&&etapaOpen(S.ui.etapa)?S.ui.etapa:openEtapas[0].id;
  S.ui.etapa=etapa;

  const etapaInfo=ETAPAS.find(e=>e.id===etapa);
  const yaEnvio=myPred[etapa]?.submitted;

  if(yaEnvio){
    return stepEtapaEnviada(etapa, etapaInfo);
  }

  if(etapa==='grupos'){
    if(S.ui.step==='golesGrupos') return stepGolesGrupos();
    if(S.ui.step==='confirmGrupos') return stepConfirmGrupos();
    return stepGrupos();
  }
  // KO steps
  if(S.ui.step==='golesKO_'+etapa) return stepGolesKO(etapa, etapaInfo);
  if(S.ui.step==='confirmKO_'+etapa) return stepConfirmKO(etapa, etapaInfo);
  return stepKO(etapa, etapaInfo);
}

function stepGrupos(){
  const gi=S.ui.gi||0;
  const g=GROUPS[gi];
  const teams=getTeams(g);
  const pred=S.pred.grupos||{};
  if(!pred[g]) pred[g]={pos:['','',''], pasa:false};
  const pos=pred[g].pos||['','',''];
  const pasa=pred[g].pasa||false;

  // Cuantos terceros ya marcaron pasa=true
  const totalTercerosPasan=GROUPS.filter(gr=>S.pred.grupos?.[gr]?.pasa).length;
  const maxTerceros=8;
  const canTogglePasa=pasa||(totalTercerosPasan<maxTerceros);

  // Chips de equipos
  const usedSet=new Set(pos.filter(Boolean));
  const chips=teams.map(t=>`
    <button class="team-chip${usedSet.has(t)?' used':''}" data-team="${esc(t)}" onclick="assignTeam('${g}','${esc(t)}')">
      ${esc(t)}
    </button>`).join('');

  // Slots podio
  const slotLabels=[' 1er lugar',' 2do lugar',' 3er lugar'];
  const slots=slotLabels.map((lbl,i)=>`
    <div class="podium-slot${pos[i]?' filled':' empty'}" onclick="clearPos('${g}',${i})" style="cursor:pointer">
      <span style="font-size:16px;min-width:24px">${['','',''][i]}</span>
      <div style="flex:1">
        <div style="font-size:10px;color:#8899cc;margin-bottom:2px">${lbl}</div>
        <div style="font-size:14px;font-weight:600">${pos[i]?esc(pos[i]):'<span style="color:#1e2d5e">--</span>'}</div>
      </div>
      ${pos[i]?'<span style="font-size:11px;color:#f87171">&#x2715;</span>':''}
    </div>`).join('');

  const allFilled=pos.filter(Boolean).length===3;
  const isLast=gi===11;

  // Progreso
  const gruposCompletos=GROUPS.filter(gr=>{
    const p=S.pred.grupos?.[gr]?.pos||[];
    return p.filter(Boolean).length===3;
  }).length;

  return `
<div class="page">
  <div class="row" style="margin-bottom:8px">
    <button class="back" style="padding:0;margin:0" onclick="if(${gi}>0){S.ui.gi--;render();}else{S.view='home';render();}"><-</button>
    <div style="flex:1">
      <div style="font-size:15px;font-weight:700">Grupo ${g}</div>
      <div style="font-size:11px;color:#8899cc">${gruposCompletos}/12 grupos . ${totalTercerosPasan}/8 terceros</div>
    </div>
    <span style="font-size:11px;color:#8899cc">${esc(S.user?.name)}</span>
  </div>

  <div style="height:3px;background:#1e2d5e;border-radius:2px;margin-bottom:14px;overflow:hidden">
    <div style="height:100%;width:${Math.round(gruposCompletos/12*100)}%;background:#2979ff;border-radius:2px;transition:width .3s"></div>
  </div>

  ${slots}

  ${allFilled?`
  <div style="display:flex;align-items:center;gap:10px;background:#0f1840;border:1.5px solid ${pasa?'#2979ff':'#1e2d5e'};border-radius:11px;padding:10px 12px;margin-bottom:10px">
    <div style="flex:1">
      <div style="font-size:13px;font-weight:600"> ${esc(pos[2])} clasifica como 3ro</div>
      <div style="font-size:11px;color:#8899cc">${totalTercerosPasan}/8 terceros seleccionados</div>
    </div>
    <button class="toggle${pasa?' on':''}" ${canTogglePasa?'':'disabled'} onclick="togglePasa('${g}')"></button>
  </div>`:''}

  <div style="font-size:11px;color:#8899cc;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px">Equipos del grupo ${g}</div>
  <div style="display:flex;flex-wrap:wrap;gap:2px;margin-bottom:16px">${chips}</div>

  <button class="btn-primary btn-full" style="padding:13px" ${!allFilled?'disabled':''} onclick="${isLast?'confirmGrupos()':'S.ui.gi++;render()'}">
    ${isLast?'Confirmar fase de grupos':'Grupo '+GROUPS[gi+1]+' ->'}
  </button>
</div>`;
}

function assignTeam(g,team){
  if(!S.pred.grupos) S.pred.grupos={};
  if(!S.pred.grupos[g]) S.pred.grupos[g]={pos:['','',''],pasa:false};
  const pos=S.pred.grupos[g].pos;
  if(pos.includes(team)) return;
  const idx=pos.findIndex(x=>!x);
  if(idx===-1) return;
  pos[idx]=team;
  render();
}

function clearPos(g,i){
  if(!S.pred.grupos?.[g]) return;
  const pos=S.pred.grupos[g].pos;
  // Si limpiamos el 3ro, desactivar pasa
  if(i===2) S.pred.grupos[g].pasa=false;
  pos[i]='';
  render();
}

function togglePasa(g){
  if(!S.pred.grupos?.[g]) return;
  const cur=S.pred.grupos[g].pasa||false;
  const total=GROUPS.filter(gr=>S.pred.grupos?.[gr]?.pasa).length;
  if(!cur && total>=8) return; // ya hay 8
  S.pred.grupos[g].pasa=!cur;
  render();
}

function confirmGrupos(){
  // Verificar todos los grupos completos
  const incompletos=GROUPS.filter(g=>{
    const p=S.pred.grupos?.[g]?.pos||[];
    return p.filter(Boolean).length<3;
  });
  if(incompletos.length){
    alert('Faltan completar los grupos: '+incompletos.join(', '));
    S.ui.gi=GROUPS.indexOf(incompletos[0]);
    render();
    return;
  }
  const totalPasan=GROUPS.filter(g=>S.pred.grupos?.[g]?.pasa).length;
  if(totalPasan!==8){
    alert('Debes seleccionar exactamente 8 terceros que pasan. Tenes '+totalPasan+'.');
    render();
    return;
  }
  // Ir a goles si hay alguna fecha habilitada, sino confirmar directo
  const cfg=getConfig();
  const r1=cfg.etapas?.grupos?.ronda1||'pending';
  const r2=cfg.etapas?.grupos?.ronda2||'pending';
  const r3=cfg.etapas?.grupos?.ronda3||'pending';
  if(r1!=='pending'||r2!=='pending'||r3!=='pending'){
    S.ui.step='golesGrupos';
  } else {
    S.ui.step='confirmGrupos';
  }
  render();
}

async function loadRanking(){
  const el=document.getElementById('rankList');
  if(!el) return;
  try{
    const[predSnap,resDoc]=await Promise.all([
      db.collection('predictions').get(),
      db.doc('results/official').get()
    ]);
    const res=resDoc.exists?resDoc.data():emptyResults();
    const cfg=getConfig();
    const arr=[];
    predSnap.docs.forEach(d=>{
      const data=d.data();
      const sc=calcScore(data,res,cfg);
      arr.push({name:data.name||d.id, code:d.id, sc, pred:data});
    });
    arr.sort((a,b)=>b.sc-a.sc);
    if(!arr.length){el.innerHTML='<div class="spinner">Sin pronosticos aun.</div>';return;}

    const medals=['&#127947;','&#129352;','&#129353;'];
    el.innerHTML=arr.map((p,i)=>`
    <div class="card" style="display:flex;align-items:center;gap:12px;margin-bottom:8px${i===0?';border-color:#d4af37':''}">
      <div style="font-size:${i<3?20:14}px;min-width:28px;text-align:center;font-weight:700">${medals[i]||(i+1)}</div>
      <div style="flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="text-align:right">
          <div style="font-size:22px;font-weight:800;${i===0?'color:#d4af37':''}">${p.sc}</div>
          <div style="font-size:10px;color:#8899cc">pts</div>
        </div>
        ${(S.user?.code===p.code||S.admin?.auth)?`<button class="btn-sm" style="font-size:11px" data-detail="${p.code}">Ver detalle</button>`:''}
      </div>
    </div>`).join('');

    // Attach detail buttons
    document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{
      const found=arr.find(p=>p.code===b.dataset.detail);
      if(found) showDetail(found, res);
    });
  }catch(e){if(el)el.innerHTML='<div class="spinner">Error al cargar.</div>';}
}

function showDetail(part, res){
  const items=calcScoreDetail(part.pred, res);
  const total=items.reduce((a,i)=>a+i.pts,0);

  // Group by category
  const cats={};
  items.forEach(item=>{
    if(!cats[item.cat]) cats[item.cat]=[];
    cats[item.cat].push(item);
  });

  const catTitles={Grupos:'Fase de Grupos', Terceros:'Terceros que pasan', Goles:'Goles Argentina & Messi', KO:'Fase Eliminatoria'};

  const detailHTML=Object.keys(catTitles).map(cat=>{
    const catItems=cats[cat]||[];
    if(!catItems.length) return '';
    const catPts=catItems.reduce((a,i)=>a+i.pts,0);
    return `
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div class="section-title" style="margin:0">${catTitles[cat]}</div>
        <div style="font-size:13px;font-weight:700;color:#2979ff">${catPts} pts</div>
      </div>
      ${catItems.map(item=>`
      <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:#080d24;border-radius:9px;margin-bottom:4px">
        <span style="font-size:14px">${item.ok===true?'<span style="color:#22c55e">OK</span>':item.ok==='partial'?'<span style="color:#f59e0b">~</span>':'<span style="color:#f87171">X</span>'}</span>
        <div style="flex:1;font-size:12px;color:${item.ok===true?'#fff':item.ok==='partial'?'#f59e0b':'#8899cc'}">${esc(item.desc)}</div>
        <div style="font-size:13px;font-weight:700;color:${item.pts>0?'#22c55e':'#8899cc'}">${item.pts>0?'+'+item.pts:'-'}</div>
      </div>`).join('')}
    </div>`;
  }).join('');

  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(8,13,36,.95);z-index:1000;overflow-y:auto;padding:20px 16px';
  modal.innerHTML=`
  <div style="max-width:460px;margin:0 auto">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <button onclick="this.closest('div[style]').remove()" style="background:none;border:none;color:#8899cc;font-size:18px;cursor:pointer;padding:0">X</button>
      <div style="flex:1">
        <div style="font-size:16px;font-weight:700">${esc(part.name)}</div>
        <div style="font-size:12px;color:#8899cc">Detalle de puntaje</div>
      </div>
      <div style="font-size:28px;font-weight:800;color:#2979ff">${total} pts</div>
    </div>
    ${detailHTML||'<p style="font-size:13px;color:#8899cc;text-align:center;padding:20px">Aun no hay resultados cargados.</p>'}
  </div>`;
  document.body.appendChild(modal);
}

  if(btnCode) btnCode.onclick=doLogin;
  const codeInp=document.getElementById('codeInp');
  if(codeInp){ codeInp.oninput=e=>S.code=e.target.value.toUpperCase(); codeInp.onkeydown=e=>{if(e.key==='Enter')doLogin();}; }

  // Admin login
  const btnAdminLogin=document.getElementById('btnAdminLogin');
  if(btnAdminLogin) btnAdminLogin.onclick=doAdminLogin;
  const adminPwd=document.getElementById('adminPwd');
  if(adminPwd) adminPwd.onkeydown=e=>{if(e.key==='Enter')doAdminLogin();};

  // Admin tabs
  document.querySelectorAll('[data-atab]').forEach(b=>b.onclick=()=>{S.admin.tab=b.dataset.atab;render();});
  document.querySelectorAll('[data-asubtab]').forEach(b=>b.onclick=()=>{S.admin.subTab=b.dataset.asubtab;render();});

  // Participantes
  const btnAdd=document.getElementById('btnAddPartic');
  if(btnAdd) btnAdd.onclick=addPartic;
  const newNameInp=document.getElementById('newNameInp');
  if(newNameInp) newNameInp.oninput=e=>S.newName=e.target.value;
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delPartic(b.dataset.del, b.dataset.delname));

  // Config: set status
  document.querySelectorAll('[data-setstatus]').forEach(b=>b.onclick=()=>setEtapaStatus(b.dataset.setstatus, b.dataset.val));
  document.querySelectorAll('[data-setronda]').forEach(b=>b.onclick=()=>setRondaStatus(b.dataset.setronda, b.dataset.ronda, b.dataset.val));

  // Guardar config
  const btnSaveCfg=document.getElementById('btnSaveConfig');
  if(btnSaveCfg) btnSaveCfg.onclick=saveConfig;

  // Cruces inputs
  document.querySelectorAll('[data-cruce]').forEach(inp=>inp.oninput=e=>{
    const[etapa,idx,side]=e.target.dataset.cruce.split('.');
    if(!S.config) S.config=emptyConfig();
    if(!S.config.etapas[etapa].cruces) S.config.etapas[etapa].cruces=[];
    while(S.config.etapas[etapa].cruces.length<=parseInt(idx)) S.config.etapas[etapa].cruces.push({h:'',a:''});
    S.config.etapas[etapa].cruces[parseInt(idx)][side]=e.target.value;
  });

  // Resultados: selects de clasificados y goles
  document.querySelectorAll('[data-res]').forEach(inp=>inp.oninput=e=>{
    const path=e.target.dataset.res.split('.');
    if(!S.results) S.results=emptyResults();
    let obj=S.results;
    for(let i=0;i<path.length-1;i++){
      if(obj[path[i]]===undefined) obj[path[i]]={};
      // handle array index
      if(!isNaN(path[i+1])) obj[path[i]]=obj[path[i]]||[];
      obj=obj[path[i]];
    }
    const last=path[path.length-1];
    const val=e.target.value;
    obj[last]=val===''?null:(isNaN(val)?val:parseInt(val));
  });

  // Terceros select (array)
  document.querySelectorAll('[data-res^="terceros."]').forEach(sel=>sel.oninput=e=>{
    const idx=parseInt(e.target.dataset.res.split('.')[1]);
    if(!S.results) S.results=emptyResults();
    if(!S.results.terceros) S.results.terceros=[];
    S.results.terceros[idx]=e.target.value;
  });

  // grupos pos select
  document.querySelectorAll('[data-res^="grupos."]').forEach(sel=>sel.oninput=e=>{
    const parts=e.target.dataset.res.split('.');
    const g=parts[1], posIdx=parseInt(parts[3]);
    if(!S.results) S.results=emptyResults();
    if(!S.results.grupos) S.results.grupos={};
    if(!S.results.grupos[g]) S.results.grupos[g]={pos:['','','']};
    S.results.grupos[g].pos[posIdx]=e.target.value;
  });

  // KO winner buttons
  document.querySelectorAll('[data-kov]').forEach(b=>b.onclick=()=>{
    const mid=b.dataset.kov, side=b.dataset.side;
    if(!S.results) S.results=emptyResults();
    if(!S.results.ko) S.results.ko={};
    if(!S.results.ko[mid]) S.results.ko[mid]={};
    S.results.ko[mid].w=S.results.ko[mid].w===side?null:side;
    // Store team names
    const etapa=mid.split('_').slice(0,-1).join('_');
    const idx=parseInt(mid.split('_').pop())-1;
    const c=getConfig().etapas?.[etapa]?.cruces?.[idx]||{};
    S.results.ko[mid].h=c.h||'';
    S.results.ko[mid].a=c.a||'';
    render();
  });

  // Guardar resultados
  const btnSaveRes=document.getElementById('btnSaveRes');
  if(btnSaveRes) btnSaveRes.onclick=saveResults;

  // Refresh ranking
  const btnRef=document.getElementById('btnRefreshRank');
  if(btnRef){ btnRef.onclick=loadRanking; loadRanking(); }

  // KO buttons en el prode del participante
  document.querySelectorAll('[data-mid][data-side]').forEach(b=>b.onclick=()=>{
    const mid=b.dataset.mid, side=b.dataset.side;
    if(!S.pred.ko) S.pred.ko={};
    if(!S.pred.ko[mid]) S.pred.ko[mid]={};
    S.pred.ko[mid].w=S.pred.ko[mid].w===side?null:side;
    // Store team names from cruces
    const parts=mid.split('_');
    const etapa=parts.slice(0,-1).join('_');
    const idx=parseInt(parts[parts.length-1])-1;
    const c=getConfig().etapas?.[etapa]?.cruces?.[idx]||{};
    S.pred.ko[mid].h=c.h||'';
    S.pred.ko[mid].a=c.a||'';
    const sy=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,sy));
  });

  // Goles inputs en prode
  document.querySelectorAll('[data-gol]').forEach(inp=>inp.oninput=e=>{
    if(!S.pred.goles) S.pred.goles={};
    const v=e.target.value;
    S.pred.goles[e.target.dataset.gol]=v===''?null:parseInt(v);
  });

  // Confirm grupos button
  const btnSG=document.getElementById('btnSubmitGrupos');
  if(btnSG) btnSG.onclick=submitGrupos;

  // Confirm KO button
  const btnSubmitKO=document.getElementById('btnSubmitKO');
  if(btnSubmitKO) btnSubmitKO.onclick=()=>submitKO(btnSubmitKO.dataset.etapa);
}

// --- ACTIONS -------------------------------------------------
async function doLogin(){
  const code=(S.code||'').trim().toUpperCase();
  if(!code){S.codeErr='Ingresa tu codigo.';render();return;}
  S.codeErr='';
  const el=document.getElementById('codeErr');
  if(el) el.textContent='Verificando...';
  try{
    const doc=await db.doc('participants/'+code).get();
    if(!doc.exists){S.codeErr='Codigo no encontrado.';render();return;}
    S.user={name:doc.data().name,code};
    // Cargar predicciones existentes
    const predDoc=await db.doc('predictions/'+code).get();
    S.pred=predDoc.exists?predDoc.data():{name:S.user.name,code};
    render();
  }catch(e){S.codeErr='Error de conexion.';render();}
}

function doAdminLogin(){
  const p=document.getElementById('adminPwd')?.value||'';
  if(p===ADMIN_PASS){S.admin.auth=true;S.admin.err='';render();}
  else{S.admin.err='Contrasena incorrecta.';render();}
}

async function addPartic(){
  const name=S.newName.trim();
  if(!name){S.newNameErr='Ingresa un nombre.';render();return;}
  const code=Math.random().toString(36).slice(2,6).toUpperCase();
  S.admin.saving=true;S.newNameErr='';render();
  try{
    await db.doc('participants/'+code).set({name,code,createdAt:new Date().toISOString()});
    S.parts.push({name,code});
    S.newName='';
    S.newNameMsg='OK '+name+' . Codigo: '+code;
    setTimeout(()=>{S.newNameMsg='';render();},12000);
  }catch(e){S.newNameErr='Error al guardar.';}
  S.admin.saving=false;render();
}

async function delPartic(code,name){
  if(!confirm('Eliminar a '+name+'?')) return;
  try{
    await Promise.all([db.doc('participants/'+code).delete(), db.doc('predictions/'+code).delete().catch(()=>{})]);
    S.parts=S.parts.filter(p=>p.code!==code);render();
  }catch(e){alert('Error.');}
}

function setEtapaStatus(etapa,val){
  if(!S.config) S.config=emptyConfig();
  S.config.etapas[etapa].status=val;
  render();
}

function setRondaStatus(etapa, ronda, val){
  if(!S.config) S.config=emptyConfig();
  S.config.etapas[etapa][ronda]=val;
  render();
}

async function saveConfig(){
  S.admin.saving=true;render();
  try{
    await db.doc('config/main').set(S.config);
    S.admin.msg='OK Configuracion guardada.';
  }catch(e){S.admin.msg='Error al guardar.';}
  S.admin.saving=false;
  setTimeout(()=>{S.admin.msg='';render();},3000);
  render();
}

async function saveResults(){
  S.admin.saving=true;render();
  try{
    await db.doc('results/official').set(S.results||emptyResults());
    S.admin.msg='OK Resultados guardados.';
  }catch(e){S.admin.msg='Error al guardar.';}
  S.admin.saving=false;
  setTimeout(()=>{S.admin.msg='';render();},3000);
  render();
}

async function confirmKO(etapaId){
  if(!S.user) return;
  try{
    const update={};
    update['ko']=S.pred.ko||{};
    update['goles']=S.pred.goles||{};
    update[etapaId+'_submitted']=true;
    if(!S.pred[etapaId]) S.pred[etapaId]={};
    S.pred[etapaId].submitted=true;
    await db.doc('predictions/'+S.user.code).set({...S.pred, name:S.user.name, code:S.user.code}, {merge:true});
    render();
  }catch(e){alert('Error al guardar. Intenta de nuevo.');}
}

function goToGolesKO(etapaId){
  S.ui.step='golesKO_'+etapaId;
  render();
}

async function submitKO(etapaId){
  if(!S.user) return;
  if(!S.pred[etapaId]) S.pred[etapaId]={};
  S.pred[etapaId].submitted=true;
  try{
    await db.doc('predictions/'+S.user.code).set(
      {...S.pred, name:S.user.name, code:S.user.code},
      {merge:true}
    );
    S.ui.step=null;
    render();
  }catch(err){alert('Error al guardar. Intenta de nuevo.');}
}

async function submitGrupos(){
  if(!S.user) return;
  S.pred.grupos_submitted=true;
  if(!S.pred.grupos) S.pred.grupos={};
  S.pred.grupos.submitted=true;
  if(!S.pred.r16) S.pred.r16={};
  // Armar lista de terceros que pasan
  S.pred.grupos.terceros=GROUPS.filter(g=>S.pred.grupos?.[g]?.pasa).map(g=>S.pred.grupos[g].pos[2]);
  try{
    await db.doc('predictions/'+S.user.code).set({...S.pred, name:S.user.name, code:S.user.code},{merge:true});
    S.ui.step=null;
    S.ui.etapa='grupos';
    render();
  }catch(err){alert('Error al guardar. Intenta de nuevo.');}
}

// --- INIT con escucha en tiempo real -------------------------
// Cuando el admin cambia config o resultados, todos los usuarios
// ven la actualización automáticamente sin recargar la página.

let _initError=false;
let _ready={config:false, parts:false, results:false};

function _checkReady(){
  if(_ready.config&&_ready.parts&&_ready.results) render();
}

function init(){
  // 1. Config en tiempo real (etapas abiertas/cerradas, cruces KO)
  db.doc('config/main').onSnapshot(snap=>{
    S.config=snap.exists?snap.data():emptyConfig();
    _ready.config=true;
    if(!_initError) _checkReady();
    // Si ya estaba cargado → re-render para reflejar cambios del admin
    else render();
  }, err=>{
    _initError=true;
    app.innerHTML=`<div class="page" style="text-align:center;padding-top:60px">
      <div style="font-size:40px;margin-bottom:16px">!</div>
      <h2>Error de conexion</h2><p style="margin-top:8px">Verifica la configuracion de Firebase y las reglas de Firestore.</p>
    </div>`;
  });

  // 2. Participantes en tiempo real (altas/bajas de jugadores)
  db.collection('participants').onSnapshot(snap=>{
    S.parts=snap.docs.map(d=>d.data());
    _ready.parts=true;
    if(!_initError&&_ready.config&&_ready.results) render();
  }, ()=>{ _ready.parts=true; _checkReady(); });

  // 3. Resultados oficiales en tiempo real (puntuaciones se actualizan solas)
  db.doc('results/official').onSnapshot(snap=>{
    S.results=snap.exists?snap.data():emptyResults();
    _ready.results=true;
    if(!_initError) _checkReady();
  }, ()=>{ _ready.results=true; _checkReady(); });
}
init();
</script>
