<head>
<meta charset="UTF-8">

<title>Prode Sagrado Corazón</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<style>
html,body{background:#080d24;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;margin:0;padding:0}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
#app{max-width:460px;margin:0 auto;padding-bottom:48px}
h1,h2,h3{color:#fff}
h1{font-size:26px;font-weight:700}
h2{font-size:20px;font-weight:700}
h3{font-size:15px;font-weight:600}
p{font-size:14px;color:#8899cc;line-height:1.55}
input{display:block;width:100%;padding:11px 13px;border:1.5px solid #1e2d5e;border-radius:11px;font-size:14px;font-family:inherit;background:#111d45;color:#fff;outline:none;transition:border-color .15s}
input:focus{border-color:#2979ff}
input::placeholder{color:#8899cc}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
.inp-sm{padding:6px 8px;font-size:13px;border-radius:9px;text-align:center}
button{display:inline-flex;align-items:center;justify-content:center;padding:11px 18px;border:1.5px solid #1e2d5e;border-radius:12px;font-size:14px;font-weight:500;font-family:inherit;background:#0f1840;color:#fff;cursor:pointer;transition:background .12s,transform .1s;user-select:none}
button:hover{background:#1a2a5e;border-color:#2979ff}
button:active{transform:scale(.98)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-dark{background:#2979ff;color:#fff;border-color:#2979ff}
.btn-dark:hover{background:#1a56db;border-color:#1a56db}
.btn-full{width:100%}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:9px}
.btn-danger{background:rgba(248,113,113,.1);color:#f87171;border-color:rgba(248,113,113,.3)}
.btn-danger:hover{background:rgba(248,113,113,.2)}
.page{padding:20px 16px}
.card{background:#0f1840;border:1.5px solid #1e2d5e;border-radius:16px;padding:14px 16px}
.panel{background:#0d1535;border:1px solid #1e2d5e;border-radius:13px;padding:13px 15px}
.row{display:flex;align-items:center;gap:10px}
.lbl{font-size:11px;color:#8899cc;letter-spacing:.5px;margin-bottom:5px;text-transform:uppercase}
.progress{height:3px;background:#1e2d5e;border-radius:2px;margin-bottom:16px;overflow:hidden}
.progress-fill{height:100%;background:#2979ff;border-radius:2px;transition:width .3s ease}
.err{font-size:12px;color:#f87171;margin-top:6px;min-height:16px}
.ok{font-size:12px;color:#22c55e;margin-bottom:8px}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:5px;font-weight:700;background:#111d45;color:#8899cc;min-width:20px;text-align:center}
.back{background:none;border:none;font-size:13px;color:#8899cc;cursor:pointer;padding:0 0 14px;display:flex;align-items:center;gap:5px;font-family:inherit;font-weight:500}
.back:hover{color:#fff;background:none;transform:none}
.spinner{text-align:center;padding:48px 16px;font-size:14px;color:#8899cc}
.tab-grid{display:grid;gap:6px;margin-bottom:16px}
.tab{font-size:12px;padding:9px;border-radius:9px}
.tab.on{background:#2979ff;color:#fff;border-color:#2979ff}
.header-stripe{background:linear-gradient(135deg,#080d24 0%,#0d1a4a 60%,#0a1533 100%);border-bottom:1px solid #1e2d5e;padding:28px 20px 24px;text-align:center}
.logo-img{width:80px;height:80px;border-radius:50%;margin-bottom:12px;border:2px solid #2979ff;box-shadow:0 0 20px rgba(41,121,255,.4)}
.round-title{font-size:12px;font-weight:700;color:#2979ff;margin:14px 0 8px;text-transform:uppercase;letter-spacing:.5px}
.ko-card{background:#0f1840;border:1.5px solid #1e2d5e;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ko-teams{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ko-name{flex:1;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ko-btn{padding:5px 10px;border-radius:8px;border:1.5px solid #1e2d5e;background:#111d45;color:#8899cc;font-size:12px;font-weight:600;cursor:pointer}
.ko-btn.on{background:#2979ff;color:#fff;border-color:#2979ff}
/* Podio drag */
.podium-slot{background:#0f1840;border:1.5px solid #1e2d5e;border-radius:11px;padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px;min-height:46px;cursor:pointer;transition:border-color .15s}
.podium-slot.filled{border-color:#2979ff}
.podium-slot.empty{border-style:dashed;opacity:.6}
.team-chip{display:inline-flex;align-items:center;gap:6px;background:#111d45;border:1px solid #1e2d5e;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:500;cursor:pointer;transition:all .12s}
.team-chip:hover{border-color:#2979ff;background:#1a2a5e}
.team-chip.sel{background:#2979ff22;border-color:#2979ff;color:#fff}
.team-chip.used{opacity:.35;pointer-events:none}
.scroll-box{max-height:360px;overflow-y:auto}
</style>
</head>

function getGroups(){ return S.setup?.groups || SETUP_DEFAULT.groups; }
function getGroupTeams(g){ return getGroups()[g]||[]; }

// Dado el prode del participante, devuelve el 1ro, 2do, 3ro del grupo g
function predStanding(g, pred){
  const pos = pred?.grupos?.[g]?.pos||['','',''];
  return pos; // [1ro,2do,3ro]
}

// Nombre que resuelve una clave tipo '1A','2B','T3' desde el prode del participante
function resolveKey(key, pred){
  const m=key.match(/^([123])([A-L])$/);
  if(m){
    const pos=parseInt(m[1])-1, g=m[2];
    return predStanding(g,pred)[pos]||key;
  }
  const t=key.match(/^T(\d+)$/);
  if(t){
    const idx=parseInt(t[1])-1;
    return pred?.terceros?.[idx]||key;
  }
  return key;
}

// Nombre desde resultados oficiales (para el admin / leaderboard)
function resolveKeyRes(key, res){
  // res tiene res.clasificados = {A:{pos:['Arg','Francia',...]}, terceros:[...]}
  const m=key.match(/^([123])([A-L])$/);
  if(m){
    const pos=parseInt(m[1])-1, g=m[2];
    return res?.clasificados?.[g]?.pos?.[pos]||key;
  }
  const t=key.match(/^T(\d+)$/);
  if(t){
    const idx=parseInt(t[1])-1;
    return res?.clasificados?.terceros?.[idx]||key;
  }
  return key;
}

// ── Argentina: partidos que juega según prode del participante ───
function getArgMatches(pred){
  // Grupo: 3 partidos fijos (J_0..J_5 en pares, buscar los que juega Argentina)
  const argIdx=getGroupTeams(ARG_GROUP).indexOf('Argentina');
  const pairs=PAIRS.map((p,i)=>({h:p[0],a:p[1],mi:i})).filter(p=>p.h===argIdx||p.a===argIdx);
  // + partidos KO hasta donde llegue Argentina en el prode del participante
  // Detectar dónde llega Argentina en el KO
  const koMatches=[];
  // Revisar R16
  for(const f of R16_FIXTURE){
    const h=resolveKey(f.h,pred), a=resolveKey(f.a,pred);
    if(h==='Argentina'||a==='Argentina'){
      koMatches.push({id:f.id,label:'16avos',h,a,local:h==='Argentina'});
    }
  }
  // Revisar R8
  for(let i=1;i<=8;i++){
    const id='r8_'+i;
    const w=pred?.ko?.[id]?.w;
    if(!w) break;
    const pair=KO_PAIRS_R8[i-1];
    const m1=R16_FIXTURE.find(f=>f.id===pair[0]);
    const m2=R16_FIXTURE.find(f=>f.id===pair[1]);
    const hTeam=getKOWinner(pair[0],pred,'pred');
    const aTeam=getKOWinner(pair[1],pred,'pred');
    if(hTeam==='Argentina'||aTeam==='Argentina'){
      koMatches.push({id,label:'Octavos',h:hTeam,a:aTeam,local:hTeam==='Argentina'});
    }
  }
  // R4
  for(let i=1;i<=4;i++){
    const id='r4_'+i;
    const w=pred?.ko?.[id]?.w;
    if(!w) break;
    const pair=KO_PAIRS_R4[i-1];
    const hTeam=getKOWinner(pair[0],pred,'pred');
    const aTeam=getKOWinner(pair[1],pred,'pred');
    if(hTeam==='Argentina'||aTeam==='Argentina'){
      koMatches.push({id,label:'Cuartos',h:hTeam,a:aTeam,local:hTeam==='Argentina'});
    }
  }
  // R2
  for(let i=1;i<=2;i++){
    const id='r2_'+i;
    const w=pred?.ko?.[id]?.w;
    if(!w) break;
    const pair=KO_PAIRS_R2[i-1];
    const hTeam=getKOWinner(pair[0],pred,'pred');
    const aTeam=getKOWinner(pair[1],pred,'pred');
    if(hTeam==='Argentina'||aTeam==='Argentina'){
      koMatches.push({id,label:'Semifinal',h:hTeam,a:aTeam,local:hTeam==='Argentina'});
    }
  }
  // Final/3er puesto
  const argSemi1=getKOWinner('r2_1',pred,'pred')==='Argentina';
  const argSemi2=getKOWinner('r2_2',pred,'pred')==='Argentina';
  if(argSemi1||argSemi2){
    if(pred?.ko?.['r3p']?.w||pred?.ko?.['r1_1']?.w){
      const argIn3p= argSemi1? getKOWinner('r2_1',pred,'pred')==='Argentina' && pred?.ko?.['r2_1']?.w==='a' : pred?.ko?.['r2_2']?.w==='a';
      // 3er puesto o final
      const hT=getKOWinner('r2_1',pred,'pred');
      const aT=getKOWinner('r2_2',pred,'pred');
      if(hT==='Argentina'||aT==='Argentina'){
        koMatches.push({id:'r1_1',label:'Final',h:hT,a:aT,local:hT==='Argentina'});
      }
    }
  }
  return {group:pairs, ko:koMatches};
}

function getKOWinner(matchId, pred, mode='pred'){
  const ko= mode==='pred'? pred?.ko : pred?.ko; // simplificado, ambos usan pred
  const r=ko?.[matchId];
  if(!r?.w) return null;
  // Resolver nombre según id
  if(matchId.startsWith('m')){
    const fix=R16_FIXTURE.find(f=>f.id===matchId);
    if(!fix) return null;
    const h=resolveKey(fix.h,pred), a=resolveKey(fix.a,pred);
    return r.w==='h'?h:a;
  }
  if(matchId.startsWith('r8_')){
    const i=parseInt(matchId.split('_')[1]);
    const pair=KO_PAIRS_R8[i-1];
    const h=getKOWinner(pair[0],pred), a=getKOWinner(pair[1],pred);
    return r.w==='h'?h:a;
  }
  if(matchId.startsWith('r4_')){
    const i=parseInt(matchId.split('_')[1]);
    const pair=KO_PAIRS_R4[i-1];
    const h=getKOWinner(pair[0],pred), a=getKOWinner(pair[1],pred);
    return r.w==='h'?h:a;
  }
  if(matchId.startsWith('r2_')){
    const i=parseInt(matchId.split('_')[1]);
    const pair=KO_PAIRS_R2[i-1];
    const h=getKOWinner(pair[0],pred), a=getKOWinner(pair[1],pred);
    return r.w==='h'?h:a;
  }
  return null;
}

// ── PUNTAJE ───────────────────────────────────────────────────
function calcScore(pred, res){
  let s=0;
  if(!pred||!res) return 0;
  const rc=res.clasificados||{};

  // 1. Posición en grupos
  GROUPS.forEach(g=>{
    const pp=pred?.grupos?.[g]?.pos||[];
    const rp=rc[g]?.pos||[];
    if(pp[0]&&rp[0]&&pp[0]===rp[0]) s+=3;
    if(pp[1]&&rp[1]&&pp[1]===rp[1]) s+=2;
    if(pp[2]&&rp[2]&&pp[2]===rp[2]) s+=1;
  });

  // 2. Terceros que pasan
  const rT=rc.terceros||[];
  (pred?.terceros||[]).forEach(t=>{ if(t&&rT.includes(t)) s+=2; });

  // 3. KO: ganadores por ronda
  const resKO=res.ko||{};
  const rondaPts={m:2,r8:3,r4:4,r2:5,r3p:5,r1:10};
  const getRondaKey=id=>id.startsWith('r8')?'r8':id.startsWith('r4')?'r4':id.startsWith('r2')?'r2':id==='r3p_1'?'r3p':id==='r1_1'?'r1':'m';
  Object.keys(resKO).forEach(id=>{
    const rr=resKO[id]; if(!rr?.w) return;
    const pr=pred?.ko?.[id]; if(!pr?.w) return;
    if(pr.w===rr.w) s+=rondaPts[getRondaKey(id)]||2;
  });

  // 4. Equipo que llega a cada instancia
  // Para cada ronda, comparamos qué equipos predijo el participante vs qué equipos llegaron realmente.
  // Puntos por llegar: 16avos=1, octavos=2, cuartos=3, semis=4, final=5
  // Bonus por posición final: campeón+10, subcampeón+7, 3°+5, 4°+3
  const llegaPts={m:1,r8:2,r4:3,r2:4,r1:5,r3p:5};

  // Construir set de equipos que llegaron a cada ronda (según resultados reales)
  const reachedReal={m:new Set(),r8:new Set(),r4:new Set(),r2:new Set(),r1:new Set(),r3p:new Set()};
  Object.keys(resKO).forEach(id=>{
    const rr=resKO[id]; if(!rr?.w) return;
    const rk=getRondaKey(id);
    // El ganador y el perdedor llegaron a esta ronda
    if(rr.h_name) reachedReal[rk]?.add(rr.h_name);
    if(rr.a_name) reachedReal[rk]?.add(rr.a_name);
  });

  // Construir set de equipos que el participante predijo que llegaron a cada ronda
  const reachedPred={m:new Set(),r8:new Set(),r4:new Set(),r2:new Set(),r1:new Set(),r3p:new Set()};
  Object.keys(pred?.ko||{}).forEach(id=>{
    const pr=pred.ko[id]; if(!pr?.w) return;
    const rk=getRondaKey(id);
    // Resolver nombres desde el prode del participante
    let hName,aName;
    if(id.startsWith('m')){
      const fix=R16_FIXTURE.find(f=>f.id===id);
      if(fix){hName=resolveKey(fix.h,pred);aName=resolveKey(fix.a,pred);}
    } else if(id.startsWith('r8_')){
      const i=parseInt(id.split('_')[1]);
      const pair=KO_PAIRS_R8[i-1];
      hName=getKOWinner(pair[0],pred);aName=getKOWinner(pair[1],pred);
    } else if(id.startsWith('r4_')){
      const i=parseInt(id.split('_')[1]);
      const pair=KO_PAIRS_R4[i-1];
      hName=getKOWinner(pair[0],pred);aName=getKOWinner(pair[1],pred);
    } else if(id.startsWith('r2_')){
      const i=parseInt(id.split('_')[1]);
      const pair=KO_PAIRS_R2[i-1];
      hName=getKOWinner(pair[0],pred);aName=getKOWinner(pair[1],pred);
    } else if(id==='r1_1'){
      hName=getKOWinner('r2_1',pred);aName=getKOWinner('r2_2',pred);
    } else if(id==='r3p_1'){
      hName=getKOLoser('r2_1',pred);aName=getKOLoser('r2_2',pred);
    }
    if(hName) reachedPred[rk]?.add(hName);
    if(aName) reachedPred[rk]?.add(aName);
  });

  // Sumar puntos por equipo que llegó correctamente a cada ronda
  Object.keys(llegaPts).forEach(rk=>{
    const pts=llegaPts[rk];
    reachedPred[rk]?.forEach(team=>{
      if(reachedReal[rk]?.has(team)) s+=pts;
    });
  });

  // Bonus por posición final exacta
  // Campeón = ganador de r1_1
  const resR1=resKO['r1_1']; const predR1=pred?.ko?.['r1_1'];
  if(resR1?.w && predR1?.w){
    const realChamp=resR1.w==='h'?resR1.h_name:resR1.a_name;
    const realSub  =resR1.w==='h'?resR1.a_name:resR1.h_name;
    const predChamp=predR1.w==='h'?getKOWinner('r2_1',pred):getKOWinner('r2_2',pred);
    const predSub  =predR1.w==='h'?getKOWinner('r2_2',pred):getKOWinner('r2_1',pred);
    if(realChamp&&predChamp&&realChamp===predChamp) s+=10;
    if(realSub  &&predSub  &&realSub  ===predSub  ) s+=7;
  }
  // 3° y 4° puesto
  const resR3=resKO['r3p_1']; const predR3=pred?.ko?.['r3p_1'];
  if(resR3?.w && predR3?.w){
    const real3=resR3.w==='h'?resR3.h_name:resR3.a_name;
    const real4=resR3.w==='h'?resR3.a_name:resR3.h_name;
    const pred3=predR3.w==='h'?getKOLoser('r2_1',pred):getKOLoser('r2_2',pred);
    const pred4=predR3.w==='h'?getKOLoser('r2_2',pred):getKOLoser('r2_1',pred);
    if(real3&&pred3&&real3===pred3) s+=5;
    if(real4&&pred4&&real4===pred4) s+=3;
  }

  // 5. Goles de Argentina por partido
  const resArg=res.arg||{};
  Object.keys(resArg).forEach(k=>{
    const ra=resArg[k]; if(ra===null||ra===undefined) return;
    const pa=pred?.arg?.[k]; if(pa===null||pa===undefined||pa==='') return;
    const d=Math.abs(parseInt(pa)-parseInt(ra));
    if(d===0) s+=3; else if(d===1) s+=1;
  });

  // 6. Goles de Messi por partido
  const resMessi=res.messi||{};
  Object.keys(resMessi).forEach(k=>{
    const rm=resMessi[k]; if(rm===null||rm===undefined) return;
    const pm=pred?.messi?.[k]; if(pm===null||pm===undefined||pm==='') return;
    const d=Math.abs(parseInt(pm)-parseInt(rm));
    if(d===0) s+=3; else if(d===1) s+=1;
  });

  return s;
}

const app=document.getElementById('app');
function render(){
  if(S.view==='home') app.innerHTML=viewHome();
  else if(S.view==='prode') app.innerHTML=viewProde();
  else if(S.view==='leaderboard'){app.innerHTML=viewLeaderboard();loadRanking();}
  else if(S.view==='admin') app.innerHTML=viewAdmin();

function go(v){S.view=v;render();}

// ── PRODE ─────────────────────────────────────────────────────
function viewProde(){
  if(S.step==='code') return stepCode();
  if(S.step==='grupos') return stepGrupos();
  if(S.step==='terceros') return stepTerceros();
  if(S.step==='ko') return stepKO();
  if(S.step==='arg') return stepArgMessi();
  if(S.step==='confirm') return stepConfirm();
  if(S.step==='done') return stepDone();
  return stepCode();
}

function stepCode(){
  return `
<div class="page">
  <button class="back" onclick="go('home')">&#8592; Inicio</button>
  <div style="text-align:center;margin-bottom:24px">
    <img src="${LOGO}" style="width:60px;height:60px;border-radius:50%;border:2px solid #2979ff;margin-bottom:12px">
    <h2>Tu prode</h2>
    <p style="font-size:13px">Ingresá tu código de participante</p>
  </div>
  <div class="lbl">Código</div>
  <input type="text" id="codeInp" maxlength="6" placeholder="Ej: AB12" value="${esc(S.codeVal)}"
    oninput="S.codeVal=this.value.toUpperCase()"
    onkeydown="if(event.key==='Enter')doCode()"
    style="text-align:center;font-size:22px;letter-spacing:6px;font-weight:700">
  <div class="err">${S.codeErr}</div>
  <button class="btn-dark btn-full" style="margin-top:12px;padding:13px" onclick="doCode()">Continuar &#8594;</button>
</div>`;
}

async function doCode(){
  const code=S.codeVal.trim().toUpperCase();
  if(!code){S.codeErr='Ingresá tu código.';render();return;}
  S.codeErr='';
  try{
    const doc=await db.doc('participants/'+code).get();
    if(!doc.exists){S.codeErr='Código no encontrado.';render();return;}
    const part=doc.data();
    if(part.hasProde){S.codeErr='Ya cargaste tu prode y no podés modificarlo.';render();return;}
    S.user={name:part.name,code};
    S.pred=emptyPred();
    S.step='grupos';S.gi=0;render();
  }catch(e){S.codeErr='Error al verificar. Intentá de nuevo.';render();}
}

// ── PASO 1: GRUPOS ────────────────────────────────────────────
function stepGrupos(){
  const gi=S.gi, g=GROUPS[gi];
  const teams=getGroupTeams(g);
  const pred=S.pred;
  const pos=pred.grupos[g]?.pos||['','',''];
  const totalPos=GROUPS.reduce((a,gr)=>{
    const p=pred.grupos[gr]?.pos||[];
    return a+(p.filter(x=>x).length);
  },0);
  const pct=Math.round(totalPos/(GROUPS.length*3)*100);

  // Mostrar cada equipo como chip clickeable; al hacer click se asigna a la siguiente posición vacía
  // o se quita si ya estaba asignado
  const posLabels=['🥇 1° lugar','🥈 2° lugar','🥉 3° lugar'];

  let slotRows=posLabels.map((lbl,i)=>`
    <div class="podium-slot ${pos[i]?'filled':'empty'}" onclick="clearPos('${g}',${i})">
      <span style="font-size:18px">${['🥇','🥈','🥉'][i]}</span>
      <div style="flex:1">
        <div style="font-size:10px;color:#8899cc;margin-bottom:2px">${lbl}</div>
        <div style="font-size:14px;font-weight:600">${pos[i]?esc(pos[i]):'<span style="color:#1e2d5e">—</span>'}</div>
      </div>
      ${pos[i]?'<span style="font-size:11px;color:#f87171;cursor:pointer">✕</span>':''}
    </div>`).join('');

  const usedInPos=new Set(pos.filter(Boolean));
  let teamChips=teams.map(t=>{
    const used=usedInPos.has(t);
    return `<button class="team-chip ${used?'used':''}" onclick="assignTeam('${g}','${esc(t)}')">${esc(t)}</button>`;
  }).join('');

  const allFilled=pos.filter(Boolean).length===3;
  const isLast=gi===11;

  return `
<div class="page">
  <div class="row" style="margin-bottom:10px">
    <button class="back" style="padding:0;margin:0" onclick="if(${gi}>0){S.gi--;render();}else{S.step='code';render();}">&#8592; </button>
    <div style="flex:1">
      <div style="font-size:15px;font-weight:700">Grupo ${g} — Posiciones</div>
      <div style="font-size:11px;color:#8899cc">Grupo ${gi+1} de 12</div>
    </div>
    <span style="font-size:11px;color:#8899cc">${esc(S.user?.name)}</span>
  </div>
  <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>
  <p style="font-size:12px;margin-bottom:12px">Tocá un equipo para asignarlo al siguiente lugar disponible. Tocá el lugar para quitarlo.</p>
  ${slotRows}
  <div style="margin:14px 0 6px;font-size:11px;color:#8899cc;text-transform:uppercase;letter-spacing:.5px">Equipos del grupo</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">${teamChips}</div>
  <button class="btn-dark btn-full" style="padding:13px" ${allFilled?'':'disabled'} onclick="grpNext(${isLast?1:0})">
    ${isLast?'Elegir terceros que pasan':'Grupo '+(GROUPS[gi+1]||'')}
  </button>
</div>`;
}

function grpNext(isLast){
  if(isLast){S.step='terceros';render();}
  else{S.gi++;render();}
}
function assignTeam(g,team){
  const pos=S.pred.grupos[g].pos;
  // Si ya está asignado, no hacer nada
  if(pos.includes(team)) return;
  // Buscar primer slot vacío
  const idx=pos.findIndex(x=>!x);
  if(idx===-1) return;
  pos[idx]=team;
  render();
}
function clearPos(g,i){
  S.pred.grupos[g].pos[i]='';
  render();
}

// ── PASO 2: TERCEROS ──────────────────────────────────────────
function stepTerceros(){
  const pred=S.pred;
  // Obtener todos los 3ros elegidos
  const allThirds=GROUPS.map(g=>({g,team:pred.grupos[g]?.pos?.[2]||''})).filter(x=>x.team);
  const selected=pred.terceros||[];
  const selSet=new Set(selected.filter(Boolean));

  return `
<div class="page">
  <div class="row" style="margin-bottom:10px">
    <button class="back" style="padding:0;margin:0" onclick="S.gi=11;S.step='grupos';render()">&#8592; </button>
    <div style="flex:1">
      <div style="font-size:15px;font-weight:700">Terceros que clasifican</div>
      <div style="font-size:11px;color:#8899cc">Elegí 8 de los 12 terceros</div>
    </div>
  </div>
  <p style="font-size:12px;margin-bottom:14px">De los 12 terceros de grupo que elegiste, seleccioná los <strong style="color:#fff">8 mejores</strong> que creés que pasan a 16avos.</p>
  <div style="font-size:13px;font-weight:600;margin-bottom:10px;color:${selSet.size===8?'#22c55e':'#fff'}">
    ${selSet.size}/8 seleccionados
  </div>
  <div style="display:flex;flex-direction:column;gap:7px;margin-bottom:16px">
    ${allThirds.map(({g,team})=>{
      const isSel=selSet.has(team);
      return `<div class="podium-slot ${isSel?'filled':''}" onclick="toggleTercero('${esc(team)}')" style="cursor:pointer">
        <span style="font-size:13px;color:#8899cc;min-width:24px">G.${g}</span>
        <div style="flex:1;font-size:14px;font-weight:600">${esc(team)}</div>
        <span style="font-size:18px">${isSel?'✅':'⬜'}</span>
      </div>`;
    }).join('')}
  </div>
  <button class="btn-dark btn-full" style="padding:13px" ${selSet.size!==8?'disabled':''} onclick="S.step='ko';render()">
    Fase eliminatoria &#8594;
  </button>
</div>`;
}

function toggleTercero(team){
  if(!S.pred.terceros) S.pred.terceros=[];
  const idx=S.pred.terceros.indexOf(team);
  if(idx>=0){
    S.pred.terceros.splice(idx,1);
  } else {
    if(S.pred.terceros.length>=8) return;
    S.pred.terceros.push(team);
  }
  render();
}

// ── PASO 3: KO ────────────────────────────────────────────────
function stepKO(){
  const pred=S.pred;

  // Construir los 16 cruces con nombres reales desde el prode
  const r16=R16_FIXTURE.map(f=>({
    id:f.id,
    h:resolveKey(f.h,pred)||f.h,
    a:resolveKey(f.a,pred)||f.a,
    ko:pred.ko?.[f.id]||{},
  }));

  // Octavos: ganadores de pares de 16avos
  const r8=[1,2,3,4,5,6,7,8].map(i=>{
    const pair=KO_PAIRS_R8[i-1];
    const h=getKOWinner(pair[0],pred)||'Gan. '+pair[0];
    const a=getKOWinner(pair[1],pred)||'Gan. '+pair[1];
    return {id:'r8_'+i,h,a,ko:pred.ko?.['r8_'+i]||{}};
  });

  // Cuartos
  const r4=[1,2,3,4].map(i=>{
    const pair=KO_PAIRS_R4[i-1];
    const h=getKOWinner(pair[0],pred)||'Gan. Oct '+(i*2-1);
    const a=getKOWinner(pair[1],pred)||'Gan. Oct '+(i*2);
    return {id:'r4_'+i,h,a,ko:pred.ko?.['r4_'+i]||{}};
  });

  // Semis
  const r2=[1,2].map(i=>{
    const pair=KO_PAIRS_R2[i-1];
    const h=getKOWinner(pair[0],pred)||'Gan. Cuar '+(i*2-1);
    const a=getKOWinner(pair[1],pred)||'Gan. Cuar '+(i*2);
    return {id:'r2_'+i,h,a,ko:pred.ko?.['r2_'+i]||{}};
  });

  // 3er puesto y final
  const perdSemi1=getKOLoser('r2_1',pred), perdSemi2=getKOLoser('r2_2',pred);
  const ganSemi1=getKOWinner('r2_1',pred), ganSemi2=getKOWinner('r2_2',pred);
  const r3p={id:'r3p_1',h:perdSemi1||'Perd. Semi 1',a:perdSemi2||'Perd. Semi 2',ko:pred.ko?.['r3p_1']||{}};
  const r1={id:'r1_1',h:ganSemi1||'Gan. Semi 1',a:ganSemi2||'Gan. Semi 2',ko:pred.ko?.['r1_1']||{}};

  const rounds=[
    {label:'16avos de Final',matches:r16},
    {label:'Octavos de Final',matches:r8},
    {label:'Cuartos de Final',matches:r4},
    {label:'Semifinales',matches:r2},
    {label:'3° Puesto',matches:[r3p]},
    {label:'Final',matches:[r1]},
  ];

  const rows=rounds.map(round=>`
    <div class="round-title">${round.label}</div>
    ${round.matches.map(m=>`
    <div class="ko-card">
      <div class="ko-teams">
        <span class="ko-name" style="text-align:right;${m.ko.w==='h'?'color:#fff;font-weight:700':'color:#8899cc'}">${esc(m.h)}</span>
        <button class="ko-btn${m.ko.w==='h'?' on':''}" onclick="setKO('${m.id}','h')">✓</button>
        <span style="color:#1e2d5e;font-size:11px;padding:0 2px">vs</span>
        <button class="ko-btn${m.ko.w==='a'?' on':''}" onclick="setKO('${m.id}','a')">✓</button>
        <span class="ko-name" style="${m.ko.w==='a'?'color:#fff;font-weight:700':'color:#8899cc'}">${esc(m.a)}</span>
      </div>
      ${m.ko.w?`<div style="font-size:11px;color:#22c55e">✓ ${esc(m.ko.w==='h'?m.h:m.a)}</div>`:'<div style="font-size:11px;color:#8899cc">Sin selección</div>'}
    </div>`).join('')}
  `).join('');

  return `
<div class="page">
  <div class="row" style="margin-bottom:10px">
    <button class="back" style="padding:0;margin:0" onclick="S.step='terceros';render()">&#8592; </button>
    <div style="flex:1">
      <div style="font-size:15px;font-weight:700">Fase Eliminatoria</div>
      <div style="font-size:11px;color:#8899cc">Elegí el ganador de cada partido</div>
    </div>
  </div>
  ${rows}
  <button class="btn-dark btn-full" style="margin-top:14px;padding:13px" onclick="S.step='arg';render()">Argentina y Messi &#8594;</button>
</div>`;
}

function setKO(id,side){
  if(!S.pred.ko[id]) S.pred.ko[id]={};
  S.pred.ko[id].w=S.pred.ko[id].w===side?null:side;
  const sy=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,sy));
}

function getKOLoser(matchId, pred){
  const r=pred?.ko?.[matchId];
  if(!r?.w) return null;
  if(matchId.startsWith('r2_')){
    const i=parseInt(matchId.split('_')[1]);
    const pair=KO_PAIRS_R2[i-1];
    const h=getKOWinner(pair[0],pred), a=getKOWinner(pair[1],pred);
    return r.w==='h'?a:h;
  }
  return null;
}

// ── PASO 4: ARGENTINA & MESSI ─────────────────────────────────
function stepArgMessi(){
  const pred=S.pred;
  const teams=getGroupTeams(ARG_GROUP);
  const argIdx=teams.indexOf('Argentina');
  if(argIdx===-1) return `<div class="page"><p>Argentina no está en el Grupo J.</p><button onclick="S.step='ko';render()">&#8592; Volver</button></div>`;

  // Partidos de grupos de Argentina
  const groupMatches=PAIRS.map(([hi,ai],mi)=>{
    if(hi!==argIdx&&ai!==argIdx) return null;
    const local=hi===argIdx;
    const rival=teams[local?ai:hi];
    const kArg=ARG_GROUP+'_'+mi+'_arg';
    const kMes=ARG_GROUP+'_'+mi+'_mes';
    return {id:ARG_GROUP+'_'+mi, label:'Grupo J vs '+rival, local, kArg, kMes};
  }).filter(Boolean);

  // Partidos KO de Argentina
  const koMatchIds=[];
  const addIfArg=(matchId,label)=>{
    const h=getKOWinner_pred(matchId);
    const ko=pred.ko?.[matchId];
    if(!ko?.w) return;
    // Obtener equipos
    let hTeam,aTeam;
    if(matchId.startsWith('m')){
      const fix=R16_FIXTURE.find(f=>f.id===matchId);
      hTeam=resolveKey(fix.h,pred); aTeam=resolveKey(fix.a,pred);
    } else if(matchId.startsWith('r8_')){
      const i=parseInt(matchId.split('_')[1]);
      const pair=KO_PAIRS_R8[i-1];
      hTeam=getKOWinner(pair[0],pred); aTeam=getKOWinner(pair[1],pred);
    } else if(matchId.startsWith('r4_')){
      const i=parseInt(matchId.split('_')[1]);
      const pair=KO_PAIRS_R4[i-1];
      hTeam=getKOWinner(pair[0],pred); aTeam=getKOWinner(pair[1],pred);
    } else if(matchId.startsWith('r2_')){
      const i=parseInt(matchId.split('_')[1]);
      const pair=KO_PAIRS_R2[i-1];
      hTeam=getKOWinner(pair[0],pred); aTeam=getKOWinner(pair[1],pred);
    } else if(matchId==='r1_1'){
      hTeam=getKOWinner('r2_1',pred); aTeam=getKOWinner('r2_2',pred);
    } else if(matchId==='r3p_1'){
      hTeam=getKOLoser('r2_1',pred); aTeam=getKOLoser('r2_2',pred);
    }
    if(hTeam==='Argentina'||aTeam==='Argentina'){
      const rival2=hTeam==='Argentina'?aTeam:hTeam;
      koMatchIds.push({id:matchId, label:label+' vs '+(rival2||'?'), kArg:matchId+'_arg', kMes:matchId+'_mes'});
    }
  };

  // 16avos
  R16_FIXTURE.forEach(f=>addIfArg(f.id,'16avos'));
  for(let i=1;i<=8;i++) addIfArg('r8_'+i,'Octavos '+i);
  for(let i=1;i<=4;i++) addIfArg('r4_'+i,'Cuartos '+i);
  for(let i=1;i<=2;i++) addIfArg('r2_'+i,'Semifinal '+i);
  addIfArg('r1_1','Final');

  const allMatches=[...groupMatches, ...koMatchIds];

  if(!allMatches.length){
    return `

        </div>

          <input type="number" class="inp-sm" min="0" max="10" placeholder="—"
            value="${pred.messi?.[m.kMes]??''}"
            oninput="setPredNum('messi','${m.kMes}',this.value)"
            style="width:100%;text-align:center;font-size:18px;font-weight:700">
        </div>
      </div>
    </div>`).join('');

  return `
<div class="page">
  <div class="row" style="margin-bottom:10px">
    <button class="back" style="padding:0;margin:0" onclick="S.step='ko';render()">&#8592; </button>
    <div style="flex:1">
      <div style="font-size:15px;font-weight:700">🇦🇷 Argentina & Messi</div>
      <div style="font-size:11px;color:#8899cc">Predicción de goles por partido</div>
    </div>
  </div>
  <div style="background:rgba(41,121,255,.08);border:1px solid rgba(41,121,255,.3);border-radius:11px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:#8899cc">
    🏅 <strong style="color:#fff">+3 pts</strong> goles exactos · <strong style="color:#fff">+1 pt</strong> diferencia de ±1
  </div>
  ${rows}
  <button class="btn-dark btn-full" style="margin-top:6px;padding:13px" onclick="S.step='confirm';render()">
    Confirmar prode &#8594;
  </button>
</div>`;
}

async function loadRanking(){
  const el=document.getElementById('rankList');
  if(!el) return;
  el.innerHTML='<div class="spinner">Calculando...</div>';
  try{
    const[partsSnap,resDoc,predSnap]=await Promise.all([
      db.collection('participants').get(),
      db.doc('results/official').get(),
      db.collection('predictions').get()
    ]);
    S.parts=partsSnap.docs.map(d=>d.data());
    const res=resDoc.exists?resDoc.data():{};
    const predMap={};
    predSnap.docs.forEach(d=>predMap[d.id]=d.data());
    const arr=S.parts
      .filter(p=>p.hasProde)
      .map(p=>({...p,sc:calcScore(predMap[p.code],res)}))
      .sort((a,b)=>b.sc-a.sc);
    if(!arr.length){el.innerHTML='<div class="spinner">Aún no hay pronósticos.</div>';return;}
    el.innerHTML=arr.map((s,i)=>`
    <div class="card" style="display:flex;align-items:center;gap:12px;margin-bottom:8px${i===0?';border-color:#d4af37;box-shadow:0 0 12px rgba(212,175,55,.2)':''}">
      <div style="font-size:${i<3?20:14}px;min-width:28px;text-align:center;font-weight:700">${MEDALS[i]??(i+1)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.name)}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:22px;font-weight:800;${i===0?'color:#d4af37':''}">${s.sc}</div>
        <div style="font-size:10px;color:#8899cc">pts</div>
      </div>
    </div>`).join('');
  }catch(e){if(el)el.innerHTML='<div class="spinner">Error al cargar.</div>';}
}

async function addParticipant(){
  const name=S.newName.trim();
  if(!name){S.newNameErr='Ingresá un nombre.';render();return;}
  if(S.parts.find(p=>p.name.toLowerCase()===name.toLowerCase())){S.newNameErr='Ya existe.';render();return;}
  const code=generateCode();
  S.newNameErr='';S.saving=true;render();
  try{
    const part={name,code,hasProde:false,createdAt:new Date().toISOString()};
    await db.doc('participants/'+code).set(part);
    S.parts.push(part);S.newName='';
    S.newNameMsg='✓ '+name+' agregado · Código: '+code;
    setTimeout(()=>{S.newNameMsg='';render();},10000);
  }catch(e){S.newNameErr='Error al guardar.';}
  S.saving=false;render();
}
async function deleteProde(code,name){
  if(!confirm('¿Borrar el pronóstico de '+name+'?')) return;
  try{
    await db.doc('predictions/'+code).delete();
    await db.doc('participants/'+code).update({hasProde:false,submittedAt:null});
    const idx=S.parts.findIndex(p=>p.code===code);
    if(idx>=0) S.parts[idx].hasProde=false;render();
  }catch(e){alert('Error.');}
}
async function deleteParticipant(code,name){
  if(!confirm('¿Eliminar a '+name+'?')) return;
  try{
    await db.doc('participants/'+code).delete();
    await db.doc('predictions/'+code).delete().catch(()=>{});
    S.parts=S.parts.filter(p=>p.code!==code);render();
  }catch(e){alert('Error.');}
}

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span style="font-size:12px;color:#8899cc;min-width:20px">${i+1}</span>
      <select style="flex:1;background:#111d45;color:#fff;border:1.5px solid #1e2d5e;border-radius:9px;padding:7px 10px;font-size:13px;font-family:inherit"

    </div>`).join('')}

  // Sección KO: ganadores
  const koRounds=[
    {label:'16avos',ids:R16_FIXTURE.map(f=>f.id)},
    {label:'Octavos'  ,ids:[1,2,3,4,5,6,7,8].map(i=>'r8_'+i)},

    {label:'3° Puesto',ids:['r3p_1']},
    {label:'Final'    ,ids:['r1_1']},
  ];

  // Resolver nombres desde clasificados reales para mostrar en admin
  const resolveR=(key)=>resolveKeyRes(key,{clasificados:cl});
  const koSection=koRounds.map(round=>`
    <div class="round-title">${round.label}</div>
    ${round.ids.map(mid=>{
      let h='?',a='?';
      if(mid.startsWith('m')){
        const fix=R16_FIXTURE.find(f=>f.id===mid);
        if(fix){h=resolveR(fix.h)||fix.h;a=resolveR(fix.a)||fix.a;}
      }
      const r=lr.ko?.[mid]||{};
      return `
      <div style="background:#080d24;border:1px solid #1e2d5e;border-radius:10px;padding:8px 10px;margin-bottom:7px">
        <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap">

            onclick="setKORes('${mid}','w','a');render()">${esc(r.a_name||a||'Visit.')}</button>
          ${r.w?'<span style="color:#22c55e">✓</span>':''}
        </div>

    }).join('')}
  `).join('');

  // Sección goles Argentina y Messi por partido de grupos
  const teams=getGroupTeams(ARG_GROUP);
  const argIdx=teams.indexOf('Argentina');
  const argGroupMatches=PAIRS.map(([hi,ai],mi)=>{
    if(hi!==argIdx&&ai!==argIdx) return null;

  return `

  ${koSection}
  <div class="round-title">⚽ Goles Argentina & Messi — Grupos</div>
  <div class="panel" style="margin-bottom:8px">${argGroupMatches||'<p style="font-size:12px">Argentina no tiene partidos de grupo aún.</p>'}</div>
  ${argKoSection?`<div class="round-title">⚽ Goles Argentina & Messi — KO</div><div class="panel" style="margin-bottom:8px">${argKoSection}</div>`:''}
  <div style="margin-top:12px">
    ${S.adminMsg?`<div class="${S.adminMsg.includes('Error')?'err':'ok'}" style="text-align:center;margin-bottom:8px">${S.adminMsg}</div>`:''}
    <button class="btn-dark btn-full" style="padding:13px" ${S.saving?'disabled':''} onclick="saveResultados()">
      ${S.saving?'Guardando...':'💾 Guardar resultados'}
    </button>
  </div>
</div>`;
}

function setClasificado(g,i,val){
  if(!S.lr.clasificados) S.lr.clasificados={};
  if(!S.lr.clasificados[g]) S.lr.clasificados[g]={pos:['','','']};
  S.lr.clasificados[g].pos[i]=val;
}
function setTerceroRes(i,val){
  if(!S.lr.clasificados) S.lr.clasificados={};
  if(!S.lr.clasificados.terceros) S.lr.clasificados.terceros=[];
  S.lr.clasificados.terceros[i]=val;
}
function setKORes(id,field,val){
  if(!S.lr.ko) S.lr.ko={};
  if(!S.lr.ko[id]) S.lr.ko[id]={};
  S.lr.ko[id][field]=val;
}
function setArgRes(field,key,val){
  if(!S.lr[field]) S.lr[field]={};
  S.lr[field][key]=val===''?null:parseInt(val);
}

async function saveResultados(){
  if(S.saving) return;
  S.saving=true;render();
  try{
    await db.doc('results/official').set(S.lr);
    S.res=JSON.parse(JSON.stringify(S.lr));
    S.adminMsg='✓ Resultados guardados correctamente.';
  }catch(e){S.adminMsg='Error al guardar. Revisá la conexión.';}
  S.saving=false;
  setTimeout(()=>{S.adminMsg='';render();},3000);
  render();
}

// ── INIT ─────────────────────────────────────────────────────
async function init(){
  try{
    const[setupDoc,partsSnap,resDoc]=await Promise.all([
      db.doc('config/setup').get(),
      db.collection('participants').get(),
      db.doc('results/official').get()
    ]);
    S.setup=setupDoc.exists?setupDoc.data():SETUP_DEFAULT;
    S.parts=partsSnap.docs.map(d=>d.data());
    const rd=resDoc.exists?resDoc.data():{};
    if(!rd.ko) rd.ko={};
    if(!rd.clasificados) rd.clasificados={};
    if(!rd.arg) rd.arg={};
    if(!rd.messi) rd.messi={};
    S.res=rd;
  }catch(e){
    app.innerHTML=`
      <div class="page" style="text-align:center;padding-top:60px">
        <div style="font-size:40px;margin-bottom:16px">⚠️</div>
        <h2 style="margin-bottom:8px">Error de conexión</h2>
        <p>Verificá la configuración de Firebase.</p>
      </div>`;
    return;
  }
  render();
}
init();
</script>
</body>
</html>
