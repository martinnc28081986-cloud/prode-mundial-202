<style>
html, body { background: #080d24; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; margin: 0; padding: 0; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
#app { max-width: 460px; margin: 0 auto; padding-bottom: 48px; }
h1,h2,h3 { color: #fff; }
h1 { font-size: 26px; font-weight: 700; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 600; }
p  { font-size: 14px; color: #8899cc; line-height: 1.55; }
input {
  display: block; width: 100%; padding: 11px 13px;
  border: 1.5px solid #1e2d5e; border-radius: 11px;
  font-size: 14px; font-family: inherit;
  background: #111d45; color: #fff; outline: none;
  transition: border-color 0.15s;
}
input:focus { border-color: #2979ff; }
input::placeholder { color: #8899cc; }
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
input[type=number] { -moz-appearance: textfield; }
.inp-sm { padding: 6px 8px; font-size: 13px; border-radius: 9px; text-align: center; }
button {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 11px 18px; border: 1.5px solid #1e2d5e; border-radius: 12px;
  font-size: 14px; font-weight: 500; font-family: inherit;
  background: #0f1840; color: #fff; cursor: pointer;
  transition: background 0.12s, transform 0.1s; user-select: none;
}
button:hover { background: #1a2a5e; border-color: #2979ff; }
button:active { transform: scale(0.98); }
button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn-dark { background: #2979ff; color: #fff; border-color: #2979ff; }
.btn-dark:hover { background: #1a56db; border-color: #1a56db; }
.btn-full { width: 100%; }
.btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 9px; }
.btn-danger { background: rgba(248,113,113,0.1); color: #f87171; border-color: rgba(248,113,113,0.3); }
.btn-danger:hover { background: rgba(248,113,113,0.2); }
.r-btn { width: 36px; height: 36px; border-radius: 9px; border: 1.5px solid #1e2d5e; background: #111d45; color: #8899cc; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.12s; }
.r-btn:hover { border-color: #2979ff; color: #fff; }
.r-btn.on { background: #2979ff; color: #fff; border-color: #2979ff; }
.page { padding: 20px 16px; }
.card { background: #0f1840; border: 1.5px solid #1e2d5e; border-radius: 16px; padding: 14px 16px; }
.panel { background: #0d1535; border: 1px solid #1e2d5e; border-radius: 13px; padding: 13px 15px; }
.row { display: flex; align-items: center; gap: 10px; }
.lbl { font-size: 11px; color: #8899cc; letter-spacing: 0.5px; margin-bottom: 5px; text-transform: uppercase; }
.progress { height: 3px; background: #1e2d5e; border-radius: 2px; margin-bottom: 16px; overflow: hidden; }
.progress-fill { height: 100%; background: #2979ff; border-radius: 2px; transition: width 0.3s ease; }
.err { font-size: 12px; color: #f87171; margin-top: 6px; min-height: 16px; }
.ok { font-size: 12px; color: #22c55e; margin-bottom: 8px; }
.warn-box { background: rgba(248,113,113,0.08); border: 1.5px solid rgba(248,113,113,0.25); border-radius: 12px; padding: 12px 14px; font-size: 13px; color: #f87171; margin-bottom: 14px; }
.badge { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 5px; font-weight: 700; background: #111d45; color: #8899cc; min-width: 20px; text-align: center; }
.back { background: none; border: none; font-size: 13px; color: #8899cc; cursor: pointer; padding: 0 0 14px; display: flex; align-items: center; gap: 5px; font-family: inherit; font-weight: 500; }
.back:hover { color: #fff; background: none; transform: none; }
.spinner { text-align: center; padding: 48px 16px; font-size: 14px; color: #8899cc; }
.scroll-box { max-height: 320px; overflow-y: auto; }
.tab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 16px; }
.tab { font-size: 13px; padding: 10px; border-radius: 9px; }
.tab.on { background: #2979ff; color: #fff; border-color: #2979ff; }
.header-stripe { background: linear-gradient(135deg, #080d24 0%, #0d1a4a 60%, #0a1533 100%); border-bottom: 1px solid #1e2d5e; padding: 28px 20px 24px; text-align: center; }
.logo-img { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 12px; border: 2px solid #2979ff; box-shadow: 0 0 20px rgba(41,121,255,0.4); }
.code-highlight { font-size: 32px; font-weight: 800; letter-spacing: 8px; color: #2979ff; font-variant-numeric: tabular-nums; }
</style>

function generateCode() {
  const existing = new Set(S.parts.map(p => p.code));
  let code;
  do { code = String(Math.floor(1000 + Math.random() * 9000)); } while (existing.has(code));
  return code;
}

function calcScore(pred, res) {
  let s = 0;
  GROUPS.forEach(g => PAIRS.forEach(([,], mi) => {
    const id = g+'_'+mi, p = pred?.gm?.[id], r = res?.[id];
    if (!p?.r || !r?.r) return;
    const hg = parseInt(p.hg), ag = parseInt(p.ag);
    if (!isNaN(hg) && !isNaN(ag) && hg === parseInt(r.hg) && ag === parseInt(r.ag)) s += 5;
    else if (p.r === r.r) s += 2;
  }));
  const fp = pred?.fin || {}, rf = res?.finals || {};
  const eq = (a,b) => a && b && a.trim().toLowerCase() === b.trim().toLowerCase();
  if (eq(fp.ch,rf.ch)) s += 10; if (eq(fp.ru,rf.ru)) s += 6;
  if (eq(fp.tp,rf.tp)) s += 4;  if (eq(fp.fp,rf.fp)) s += 2;
  if (eq(fp.ts,rf.ts)) s += 8;  if (eq(fp.bp,rf.bp)) s += 5;
  if (eq(fp.as,rf.as)) s += 5;
  if (rf.mg !== undefined && rf.mg !== '' && fp.mg !== '' && fp.mg !== undefined) {
    const d = Math.abs(parseInt(fp.mg) - parseInt(rf.mg));
    if (d === 0) s += 5; else if (d <= 2) s += 2;
  }
  return s;
}

}

  if (S.step==='groups')  return stepGroups();

  if (S.step==='confirm') return stepConfirm();

}

function stepCode() {

async function doCode() {
  const code = S.codeVal.trim();
  if (!code || code.length < 4) { S.codeErr='Ingresá tu código de 4 dígitos.'; render(); return; }
  const part = S.parts.find(p => p.code === code);
  if (!part) { S.codeErr='Código inválido. Verificá con el organizador.'; render(); return; }
  if (part.hasProde) { S.codeErr='Este código ya tiene un prode confirmado. No se puede modificar.'; render(); return; }
  S.user = { name: part.name, code: part.code };
  S.codeErr=''; S.step='groups'; S.gi=0; render();
}

  <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-bottom:6px">
    <div style="font-size:10px;color:#8899cc;text-align:right">Local</div>
    <div style="font-size:10px;color:#8899cc;text-align:center;min-width:116px">1 — X — 2</div>
    <div style="font-size:10px;color:#8899cc">Visitante</div>
  </div>
  ${matchRows}
  <button class="btn-dark btn-full" style="margin-top:6px;padding:13px" onclick="${gi<11?'S.gi++;render()':"S.step='finals';render()"}">
    ${gi<11?'Grupo '+GROUPS[gi+1]+' →':'Predicciones finales →'}
  </button>
</div>`;
}

function clickResult(id,opt) {
  if (!S.pred.gm[id]) S.pred.gm[id]={};
  S.pred.gm[id].r = S.pred.gm[id].r===opt ? null : opt;
  const sy=window.scrollY; render();
  requestAnimationFrame(()=>window.scrollTo(0,sy));
}
function setPred(id,field,val) {
  if (!S.pred.gm[id]) S.pred.gm[id]={};
  S.pred.gm[id][field] = val===''?null:val;
}

function stepFinals() {
  const fp=S.pred.fin;
  const fld=(label,key,type,hint)=>`
    <div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <div class="lbl" style="margin:0">${label}</div>
        <div style="font-size:10px;color:#2979ff">${hint}</div>
      </div>
      <input type="${type}" placeholder="${label}" value="${esc(String(fp[key]??''))}"
        oninput="S.pred.fin['${key}']=this.value" style="font-size:13px;padding:9px 11px">
    </div>`;
  return `
<div class="page">
  <button class="back" onclick="S.gi=11;S.step='groups';render()">← Volver</button>
  <h2 style="margin-bottom:4px">Predicciones finales</h2>
  <p style="margin-bottom:16px">Completá tus predicciones para el final del torneo.</p>
  <div class="panel" style="margin-bottom:12px">
    <div class="lbl" style="margin-bottom:10px">Podio</div>
    ${fld('Campeón','ch','text','10 pts')}
    ${fld('Subcampeón','ru','text','6 pts')}
    ${fld('3° Puesto','tp','text','4 pts')}
    ${fld('4° Puesto','fp','text','2 pts')}
  </div>
  <div class="panel" style="margin-bottom:16px">
    <div class="lbl" style="margin-bottom:10px">Otras predicciones</div>
    ${fld('Goleador del torneo','ts','text','8 pts')}
    ${fld('Mejor jugador del torneo','bp','text','5 pts')}
    ${fld('Goleador de Argentina','as','text','5 pts')}
    ${fld('¿Cuántos goles hace Messi?','mg','number','5 pts exacto · 2 pts si ±2')}
  </div>
  <button class="btn-dark btn-full" style="padding:13px" onclick="S.step='confirm';render()">Revisar y confirmar →</button>
</div>`;
}

function stepConfirm() {
  const filled=Object.values(S.pred.gm).filter(m=>m?.r).length;
  const fp=S.pred.fin;
  return `
<div class="page">
  <button class="back" onclick="S.step='finals';render()">← Volver</button>
  <h2 style="margin-bottom:14px">Confirmar prode</h2>
  <div class="warn-box"><strong>⚠ Acción irreversible</strong><br>Una vez confirmado, tu prode queda bloqueado.</div>
  <div class="panel" style="margin-bottom:14px">
    <div class="lbl">Participante</div>
    <div style="font-size:18px;font-weight:700;margin-bottom:14px">${esc(S.user?.name||'')}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      ${[['Partidos',filled+'/72'],['Campeón',fp.ch||'—'],['Goleador',fp.ts||'—'],['Goles Messi',fp.mg!==''?fp.mg:'—']].map(([l,v])=>`
      <div class="card" style="padding:10px 12px">
        <div class="lbl">${l}</div>
        <div style="font-size:13px;font-weight:700">${esc(String(v))}</div>
      </div>`).join('')}
    </div>
  </div>
  <button class="btn-dark btn-full" style="padding:13px" ${S.saving?'disabled':''} onclick="submitProde()">
    ${S.saving?'Guardando...':'✓ Confirmar y bloquear prode'}
  </button>
</div>`;
}

async function submitProde() {
  if (S.saving) return;
  S.saving=true; render();
  try {
    const code=S.user.code;
    await db.doc('predictions/'+code).set({...S.pred, name:S.user.name, code, submittedAt:new Date().toISOString()});
    await db.doc('participants/'+code).update({hasProde:true, submittedAt:new Date().toISOString()});
    const idx=S.parts.findIndex(p=>p.code===code);
    if (idx>=0) S.parts[idx].hasProde=true;
    S.saving=false; S.step='done'; render();
  } catch(e) { S.saving=false; alert('Error al guardar.'); render(); }
}

function stepDone() {
  return `
<div class="page" style="text-align:center;padding-top:60px">
  <img src="${LOGO}" style="width:70px;height:70px;border-radius:50%;margin:0 auto 16px;display:block;border:2px solid #2979ff">
  <div style="font-size:50px;margin-bottom:12px">🎉</div>
  <h2 style="margin-bottom:8px">¡Prode guardado!</h2>
  <p style="margin-bottom:6px;font-size:15px;font-weight:600;color:#fff">${esc(S.user?.name)}</p>
  <p style="margin-bottom:30px;font-size:12px">Tus predicciones fueron registradas y no se pueden modificar.</p>
  <div style="display:flex;flex-direction:column;gap:8px">
    <button class="btn-full" style="padding:13px" onclick="go('leaderboard')">Ver tabla de posiciones →</button>
    <button class="btn-full" style="padding:13px;color:#8899cc" onclick="resetProde()">Volver al inicio</button>
  </div>
</div>`;
}
function resetProde() { S.step='code'; S.codeVal=''; S.pred=emptyPred(); S.user=null; go('home'); }

// ── LEADERBOARD ───────────────────────────────────────────────
function viewLeaderboard() {
  return `
<div>
  <div class="header-stripe" style="padding:18px 20px 14px">
    <div class="row" style="justify-content:space-between">
      <button class="back" style="padding:0;margin:0" onclick="go('home')">← </button>
      <div style="text-align:center;flex:1">
        <h2 style="font-size:16px">🏆 Tabla de posiciones</h2>
        <div id="rankMeta" style="font-size:11px;color:#8899cc;margin-top:2px">${S.parts.filter(p=>p.hasProde).length} con prode cargado</div>
      </div>
      <button class="btn-sm" onclick="loadRanking()" style="font-size:11px">↻</button>
    </div>
  </div>
  <div class="page" style="padding-top:14px">
    <div id="rankList"><div class="spinner">Calculando puntajes...</div></div>
  </div>
</div>`;
}

async function loadRanking() {
  const el=document.getElementById('rankList');
  if (!el) return;
  el.innerHTML='<div class="spinner">Calculando...</div>';
  try {
    const [partsSnap,resDoc,predSnap] = await Promise.all([
      db.collection('participants').get(),
      db.doc('results/official').get(),
      db.collection('predictions').get()
    ]);
    S.parts=partsSnap.docs.map(d=>d.data());
    if (resDoc.exists) S.res=resDoc.data();
    const predMap={};
    predSnap.docs.forEach(d=>predMap[d.id]=d.data());
    const arr=S.parts
      .filter(p=>p.hasProde)
      .map(p=>({...p, sc:calcScore(predMap[p.code],S.res), ch:predMap[p.code]?.fin?.ch}))
      .sort((a,b)=>b.sc-a.sc);
    const meta=document.getElementById('rankMeta');
    if (meta) meta.textContent=arr.length+' con prode cargado';
    if (!arr.length) { el.innerHTML='<div class="spinner">Aún no hay pronósticos cargados.</div>'; return; }
    const played=Object.keys(S.res).filter(k=>k.includes('_')&&S.res[k]?.r).length;
    el.innerHTML=`
      <div style="font-size:11px;color:#8899cc;margin-bottom:12px;text-align:center">${played} partidos jugados</div>
      ${arr.map((s,i)=>`
      <div class="card" style="display:flex;align-items:center;gap:12px;margin-bottom:8px${i===0?';border-color:#d4af37;box-shadow:0 0 12px rgba(212,175,55,0.2)':''}">
        <div style="font-size:${i<3?20:14}px;min-width:28px;text-align:center;font-weight:700">${MEDALS[i]??(i+1)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.name)}</div>
          ${s.ch?`<div style="font-size:11px;color:#8899cc;margin-top:2px">⚽ ${esc(s.ch)}</div>`:''}
        </div>
        <div style="text-align:right">
          <div style="font-size:22px;font-weight:800;${i===0?'color:#d4af37':''}">${s.sc}</div>
          <div style="font-size:10px;color:#8899cc">pts</div>
        </div>
      </div>`).join('')}`;
  } catch(e) {
    const el2=document.getElementById('rankList');
    if (el2) el2.innerHTML='<div class="spinner">Error al cargar.</div>';
  }
}

// ── ADMIN ─────────────────────────────────────────────────────
function viewAdmin() {
  if (!S.adminAuth) return viewAdminLogin();
  const tabs=[['participantes','👥 Participantes'],['resultados','⚽ Resultados']];
  return `
<div class="page">
  <div class="row" style="margin-bottom:14px">
    <button class="back" style="padding:0;margin:0" onclick="go('home')">← </button>
    <h2 style="flex:1">Admin</h2>
    <button class="btn-sm" onclick="S.adminAuth=false;render()">Salir</button>
  </div>
  <div class="tab-grid">
    ${tabs.map(([t,l])=>`<button class="btn tab${S.adminTab===t?' on':''}" onclick="S.adminTab='${t}';render()">${l}</button>`).join('')}
  </div>
  ${S.adminTab==='participantes' ? tabParticipantes() : tabResultados()}
</div>`;
}

function viewAdminLogin() {
  return `
<div class="page">
  <button class="back" onclick="go('home')">← Inicio</button>
  <div style="text-align:center;margin-bottom:24px">
    <img src="${LOGO}" style="width:60px;height:60px;border-radius:50%;border:2px solid #2979ff;margin-bottom:12px">
    <h2>Panel de Admin</h2>
  </div>
  <div class="lbl">Contraseña</div>
  <input type="password" id="adminPwd" placeholder="••••••••" onkeydown="if(event.key==='Enter')doAdminLogin()">
  <div class="err">${S.adminErr}</div>
  <button class="btn-dark btn-full" style="margin-top:12px;padding:13px" onclick="doAdminLogin()">Ingresar</button>
</div>`;
}

function doAdminLogin() {
  const p=document.getElementById('adminPwd')?.value||'';
  if (p===ADMIN_PASS) {
    S.adminAuth=true; S.adminErr='';
    S.ls=JSON.parse(JSON.stringify(S.setup));
    S.lr=JSON.parse(JSON.stringify(S.res));
    render();
  } else { S.adminErr='Contraseña incorrecta.'; render(); }
}

// ── Tab Participantes ─────────────────────────────────────────
function tabParticipantes() {
  return `
<div>
  <div class="panel" style="margin-bottom:12px">
    <h3 style="margin-bottom:10px">➕ Agregar participante</h3>
    <div class="lbl">Nombre y apellido</div>
    <input type="text" placeholder="Ej: Juan Pérez" value="${esc(S.newName)}"
      oninput="S.newName=this.value" onkeydown="if(event.key==='Enter')addParticipant()">
    <div class="err">${S.newNameErr}</div>
    ${S.newNameMsg ? `<div class="ok" style="margin-top:6px;font-size:13px;font-weight:600">${S.newNameMsg}</div>` : ''}
    <button class="btn-dark btn-full" style="margin-top:10px;padding:11px" onclick="addParticipant()">
      ${S.saving ? 'Generando...' : '+ Agregar y generar código'}
    </button>
  </div>
  <div class="panel">
    <h3 style="margin-bottom:10px">Participantes (${S.parts.length})</h3>
    ${S.parts.length===0 ? '<p style="font-size:12px">Sin participantes aún.</p>' : `
    <div class="scroll-box">
      ${S.parts.map(p=>`
      <div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #1e2d5e">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600">${esc(p.name)}</div>
          <div style="font-size:12px;margin-top:3px">
            Código: <strong style="color:#2979ff;letter-spacing:3px;font-size:15px">${esc(p.code)}</strong>
            &nbsp;·&nbsp;${p.hasProde ? '<span style="color:#22c55e">✓ Prode cargado</span>' : '<span style="color:#8899cc">Pendiente</span>'}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
          ${p.hasProde ? `<button class="btn-sm btn-danger" onclick="deleteProde('${p.code}','${esc(p.name)}')">Borrar prode</button>` : ''}
          <button class="btn-sm btn-danger" onclick="deleteParticipant('${p.code}','${esc(p.name)}')">Eliminar</button>
        </div>
      </div>`).join('')}
    </div>`}
  </div>
</div>`;
}

async function addParticipant() {
  const name=S.newName.trim();
  if (!name) { S.newNameErr='Ingresá un nombre.'; render(); return; }
  if (S.parts.find(p=>p.name.toLowerCase()===name.toLowerCase())) {
    S.newNameErr='Ya existe un participante con ese nombre.'; render(); return;
  }
  const code=generateCode();
  S.newNameErr=''; S.saving=true; render();
  try {
    const part={name, code, hasProde:false, createdAt:new Date().toISOString()};
    await db.doc('participants/'+code).set(part);
    S.parts.push(part);
    S.newName='';
    S.newNameMsg=`✓ ${name} agregado · Código: ${code}`;
    setTimeout(()=>{ S.newNameMsg=''; render(); }, 10000);
  } catch(e) { S.newNameErr='Error al guardar. Intentá de nuevo.'; }
  S.saving=false; render();
}

async function deleteProde(code,name) {
  if (!confirm('¿Borrar el pronóstico de '+name+'? El participante podrá volver a cargar su prode.')) return;
  try {
    await db.doc('predictions/'+code).delete();
    await db.doc('participants/'+code).update({hasProde:false, submittedAt:null});
    const idx=S.parts.findIndex(p=>p.code===code);
    if (idx>=0) S.parts[idx].hasProde=false;
    render();
  } catch(e) { alert('Error al borrar.'); }
}

async function deleteParticipant(code,name) {
  if (!confirm('¿Eliminar a '+name+' y su prode? No se puede deshacer.')) return;
  try {
    await db.doc('participants/'+code).delete();
    await db.doc('predictions/'+code).delete().catch(()=>{});
    S.parts=S.parts.filter(p=>p.code!==code);
    render();
  } catch(e) { alert('Error al eliminar.'); }
}

// ── Tab Resultados ────────────────────────────────────────────
function tabResultados() {
  const ls=S.ls, lr=S.lr;
  const tn=(g,i)=>ls.groups[g]?.[i]||'Eq'+(i+1);
  return `
<div>
  <p style="margin-bottom:12px;font-size:12px">Ingresá los goles de cada partido. El resultado (1/X/2) se calcula automáticamente. Podés editar en cualquier momento.</p>
  ${GROUPS.map(g=>`
  <div class="panel" style="margin-bottom:8px">
    <h3 style="margin-bottom:9px">Grupo ${g}</h3>
    ${PAIRS.map(([hi,ai],mi)=>{
      const id=g+'_'+mi, r=lr[id]||{};
      return `
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:9px">
      <span style="flex:1;text-align:right;font-size:12px;color:#8899cc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(tn(g,hi))}</span>
      <input type="number" class="inp-sm" min="0" max="20" value="${r.hg??''}" placeholder="-" style="width:36px" oninput="upRes('${id}','hg',this.value)">
      <span style="color:#1e2d5e">–</span>
      <input type="number" class="inp-sm" min="0" max="20" value="${r.ag??''}" placeholder="-" style="width:36px" oninput="upRes('${id}','ag',this.value)">
      <span style="flex:1;font-size:12px;color:#8899cc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(tn(g,ai))}</span>
      <span class="badge" id="badge_${id}" style="min-width:22px">${r.r||''}</span>
    </div>`}).join('')}
  </div>`).join('')}
  <div class="panel" style="margin-bottom:12px">
    <h3 style="margin-bottom:10px">Resultados finales</h3>
    ${[['ch','Campeón'],['ru','Subcampeón'],['tp','3° Puesto'],['fp','4° Puesto'],['ts','Goleador del torneo'],['bp','Mejor jugador'],['as','Goleador Argentina'],['mg','Goles de Messi']].map(([k,l])=>`
    <div style="margin-bottom:10px">
      <div class="lbl">${l}</div>
      <input type="${k==='mg'?'number':'text'}" value="${esc(String((lr.finals||{})[k]??''))}"
        oninput="if(!S.lr.finals)S.lr.finals={};S.lr.finals['${k}']=this.value" style="font-size:13px;padding:9px 11px">
    </div>`).join('')}
  </div>
  <div style="margin-top:12px">
    ${S.adminMsg?`<div class="${S.adminMsg.includes('Error')?'err':'ok'}" style="text-align:center;margin-bottom:8px">${S.adminMsg}</div>`:''}
    <button class="btn-dark btn-full" style="padding:13px" ${S.saving?'disabled':''} onclick="saveResultados()">
      ${S.saving?'Guardando...':'💾 Guardar resultados'}
    </button>
  </div>
</div>`;
}

function upRes(id,field,val) {
  if (!S.lr[id]) S.lr[id]={};
  S.lr[id][field]=val===''?null:Number(val);
  const h=parseInt(S.lr[id].hg), a=parseInt(S.lr[id].ag);
  S.lr[id].r=(!isNaN(h)&&!isNaN(a))?(h>a?'1':h<a?'2':'X'):null;
  const badge=document.getElementById('badge_'+id);
  if (badge) badge.textContent=S.lr[id].r||'';
}

async function saveResultados() {
  if (S.saving) return;
  S.saving=true; render();
  try {
    await db.doc('results/official').set(S.lr);
    S.res=JSON.parse(JSON.stringify(S.lr));
    S.adminMsg='✓ Resultados guardados correctamente.';
  } catch(e) { S.adminMsg='Error al guardar. Revisá la conexión.'; }
  S.saving=false;
  setTimeout(()=>{ S.adminMsg=''; render(); }, 3000);
  render();
}

// ── INIT ──────────────────────────────────────────────────────
async function init() {
  try {
    const [setupDoc,partsSnap,resDoc] = await Promise.all([
      db.doc('config/setup').get(),
      db.collection('participants').get(),
      db.doc('results/official').get()
    ]);
    S.setup = setupDoc.exists ? setupDoc.data() : SETUP_DEFAULT;
    S.parts = partsSnap.docs.map(d=>d.data());
    S.res   = resDoc.exists ? resDoc.data() : {};
  } catch(e) {
    app.innerHTML=`
      <div class="page" style="text-align:center;padding-top:60px">
        <div style="font-size:40px;margin-bottom:16px">⚠️</div>
        <h2 style="margin-bottom:8px">Error de conexión</h2>
        <p>Verificá la configuración de Firebase y las reglas de Firestore.</p>
      </div>`;
    return;
  }
  render();
}
init();
</script>
</body>
</html>
