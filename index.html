<title>Prode Sagrado Corazón</title>

<style>
html,body{background:#080d24;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;margin:0;padding:0}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
#app{max-width:460px;margin:0 auto;padding-bottom:48px}
h1,h2,h3{color:#fff}
h1{font-size:26px;font-weight:700}
h2{font-size:20px;font-weight:700}
h3{font-size:15px;font-weight:600}
p{font-size:14px;color:#8899cc;line-height:1.55}
input{display:block;width:100%;padding:11px 13px;border:1.5px solid #1e2d5e;border-radius:11px;font-size:14px;font-family:inherit;background:#111d45;color:#fff;outline:none;transition:border-color .15s}
input:focus{border-color:#2979ff}
input::placeholder{color:#8899cc}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
.inp-sm{padding:6px 8px;font-size:13px;border-radius:9px;text-align:center}
button{display:inline-flex;align-items:center;justify-content:center;padding:11px 18px;border:1.5px solid #1e2d5e;border-radius:12px;font-size:14px;font-weight:500;font-family:inherit;background:#0f1840;color:#fff;cursor:pointer;transition:background .12s,transform .1s;user-select:none}
button:hover{background:#1a2a5e;border-color:#2979ff}
button:active{transform:scale(.98)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-dark{background:#2979ff;color:#fff;border-color:#2979ff}
.btn-dark:hover{background:#1a56db;border-color:#1a56db}
.btn-full{width:100%}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:9px}
.btn-danger{background:rgba(248,113,113,.1);color:#f87171;border-color:rgba(248,113,113,.3)}
.btn-danger:hover{background:rgba(248,113,113,.2)}
.r-btn{width:36px;height:36px;border-radius:9px;border:1.5px solid #1e2d5e;background:#111d45;color:#8899cc;font-size:13px;font-weight:600;cursor:pointer;transition:all .12s}
.r-btn:hover{border-color:#2979ff;color:#fff}
.r-btn.on{background:#2979ff;color:#fff;border-color:#2979ff}
.page{padding:20px 16px}
.card{background:#0f1840;border:1.5px solid #1e2d5e;border-radius:16px;padding:14px 16px}
.panel{background:#0d1535;border:1px solid #1e2d5e;border-radius:13px;padding:13px 15px}
.row{display:flex;align-items:center;gap:10px}
.lbl{font-size:11px;color:#8899cc;letter-spacing:.5px;margin-bottom:5px;text-transform:uppercase}
.progress{height:3px;background:#1e2d5e;border-radius:2px;margin-bottom:16px;overflow:hidden}
.progress-fill{height:100%;background:#2979ff;border-radius:2px;transition:width .3s ease}
.err{font-size:12px;color:#f87171;margin-top:6px;min-height:16px}
.ok{font-size:12px;color:#22c55e;margin-bottom:8px}
.warn-box{background:rgba(248,113,113,.08);border:1.5px solid rgba(248,113,113,.25);border-radius:12px;padding:12px 14px;font-size:13px;color:#f87171;margin-bottom:14px}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:5px;font-weight:700;background:#111d45;color:#8899cc;min-width:20px;text-align:center}
.back{background:none;border:none;font-size:13px;color:#8899cc;cursor:pointer;padding:0 0 14px;display:flex;align-items:center;gap:5px;font-family:inherit;font-weight:500}
.back:hover{color:#fff;background:none;transform:none}
.spinner{text-align:center;padding:48px 16px;font-size:14px;color:#8899cc}
.scroll-box{max-height:360px;overflow-y:auto}
.tab-grid{display:grid;gap:6px;margin-bottom:16px}
.tab{font-size:12px;padding:9px;border-radius:9px}
.tab.on{background:#2979ff;color:#fff;border-color:#2979ff}
.header-stripe{background:linear-gradient(135deg,#080d24 0%,#0d1a4a 60%,#0a1533 100%);border-bottom:1px solid #1e2d5e;padding:28px 20px 24px;text-align:center}
.logo-img{width:80px;height:80px;border-radius:50%;margin-bottom:12px;border:2px solid #2979ff;box-shadow:0 0 20px rgba(41,121,255,.4)}
.round-title{font-size:12px;font-weight:700;color:#2979ff;margin:14px 0 8px;text-transform:uppercase;letter-spacing:.5px}
.ko-card{background:#0f1840;border:1.5px solid #1e2d5e;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ko-teams{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ko-name{flex:1;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ko-btn{padding:5px 10px;border-radius:8px;border:1.5px solid #1e2d5e;background:#111d45;color:#8899cc;font-size:12px;font-weight:600;cursor:pointer}
.ko-btn.on{background:#2979ff;color:#fff;border-color:#2979ff}
.ko-pending{font-size:11px;color:#8899cc;font-style:italic}
</style>
</head>

// ── Calcular standings de un grupo ────────────────────────────
function groupStandings(g,gm){
  const teams=S.setup?.groups?.[g]||['','','',''];
  const stats=teams.map((name,i)=>({name,i,pts:0,gf:0,gc:0,dif:0,w:0}));
  PAIRS.forEach(([hi,ai],mi)=>{
    const r=(gm||{})[g+'_'+mi];
    if(!r||r.hg===null||r.hg===undefined||r.ag===null||r.ag===undefined) return;
    const hg=parseInt(r.hg),ag=parseInt(r.ag);
    if(isNaN(hg)||isNaN(ag)) return;
    stats[hi].gf+=hg; stats[hi].gc+=ag; stats[hi].dif+=hg-ag;
    stats[ai].gf+=ag; stats[ai].gc+=hg; stats[ai].dif+=ag-hg;
    if(hg>ag){stats[hi].pts+=3;stats[hi].w++;}
    else if(ag>hg){stats[ai].pts+=3;stats[ai].w++;}
    else{stats[hi].pts+=1;stats[ai].pts+=1;}
  });
  return stats.sort((a,b)=>b.pts-a.pts||b.dif-a.dif||b.gf-a.gf);
}

// Obtener equipo por clave (ej: '1A', '2B')
function getTeamByKey(key,gm){
  // Caso simple: '1A', '2B', '3C' (posición + grupo)
  const m=key.match(/^([123])([A-L])$/);
  if(m){
    const pos=parseInt(m[1])-1, g=m[2];
    const st=groupStandings(g,gm);
    return st[pos]?.name||key;
  }
  // Casos de 3ros clasificados por grupo de grupos
  // Encontrar el mejor 3ro de un conjunto de grupos (toma al de más puntos/dif)
  const thirdMap={
    '3ABCD':  ['A','B','C','D'],
    '3EFGH':  ['E','F','G','H'],
    '3IJKL':  ['I','J','K','L'],
    '3ABCD2': ['A','B','C','D'],   // segundo mejor 3ro del mismo bloque (placeholder)
    'Mejor3-1':'Mejor 3° (1)',
    'Mejor3-2':'Mejor 3° (2)',
    'Mejor3-3':'Mejor 3° (3)',
    'Mejor3-4':'Mejor 3° (4)',
  };
  if(key in thirdMap){
    const groups=thirdMap[key];
    if(typeof groups==='string') return groups; // placeholder string
    // Obtener todos los 3ros de esos grupos y ordenar por pts/dif/gf
    const thirds=groups.map(g=>{
      const st=groupStandings(g,gm);
      return st[2]?{...st[2],g}:null;
    }).filter(Boolean);
    if(!thirds.length) return key;
    thirds.sort((a,b)=>b.pts-a.pts||b.dif-a.dif||b.gf-a.gf);
    // 3ABCD2 = segundo mejor 3ro del bloque
    const idx = key==='3ABCD2' ? 1 : 0;
    return thirds[idx]?.name || key;
  }
  return key;
}

  return null;
}

    const id='r1_1';
    const r=(ko||{})[id]||{};
    bracket[id]={id,h:r.h_name||getWinner(ko,'r2_1')||bracket['r2_1']?.h||'Gan. Semi 1',a:r.a_name||getWinner(ko,'r2_2')||bracket['r2_2']?.a||'Gan. Semi 2',hg:r.hg,ag:r.ag,w:r.w};
  }
  return bracket;
}

function getWinner(ko,matchId){
  const r=(ko||{})[matchId];
  if(!r||!r.w) return null;
  return r.w==='h'?r.h_name:r.a_name;
}
function getLoser(ko,matchId){
  const r=(ko||{})[matchId];
  if(!r||!r.w) return null;
  return r.w==='h'?r.a_name:r.h_name;
}

function generateCode(){
  const existing=new Set(S.parts.map(p=>p.code));
  let code;
  do{code=String(Math.floor(1000+Math.random()*9000));}while(existing.has(code));
  return code;
}

function calcScore(pred,res){
  let s=0;
  // Grupos
  GROUPS.forEach(g=>PAIRS.forEach(([,],mi)=>{
    const id=g+'_'+mi,p=pred?.gm?.[id],r=(res?.gm||{})[id];
    if(!p?.r||!r?.r) return;
    const hg=parseInt(p.hg),ag=parseInt(p.ag);
    if(!isNaN(hg)&&!isNaN(ag)&&hg===parseInt(r.hg)&&ag===parseInt(r.ag)) s+=5;
    else if(p.r===r.r) s+=2;
  }));
  // KO
  const bracket=buildKOBracket(res?.gm||{},res?.ko||{});
  Object.values(bracket).forEach(bm=>{
    const pk=pred?.ko?.[bm.id],rk=(res?.ko||{})[bm.id];
    if(!pk||!rk||!rk.w) return;
    // Resultado exacto
    if(pk.hg!==undefined&&pk.ag!==undefined&&rk.hg!==undefined&&rk.ag!==undefined&&
       parseInt(pk.hg)===parseInt(rk.hg)&&parseInt(pk.ag)===parseInt(rk.ag)) s+=5;
    else if(pk.w&&pk.w===rk.w) s+=2;
  });
  // Finals
  const fp=pred?.fin||{},rf=res?.finals||{};
  const eq=(a,b)=>a&&b&&a.trim().toLowerCase()===b.trim().toLowerCase();
  if(eq(fp.ch,rf.ch)) s+=10; if(eq(fp.ru,rf.ru)) s+=6;
  if(eq(fp.tp,rf.tp)) s+=4;  if(eq(fp.fp,rf.fp)) s+=2;
  if(eq(fp.ts,rf.ts)) s+=8;  if(eq(fp.bp,rf.bp)) s+=5;
  if(eq(fp.as,rf.as)) s+=5;
  if(rf.mg!==undefined&&rf.mg!==''&&fp.mg!==''&&fp.mg!==undefined){
    const d=Math.abs(parseInt(fp.mg)-parseInt(rf.mg));
    if(d===0) s+=5; else if(d<=2) s+=2;
  }
  return s;
}

async function loadRanking(){

async function addParticipant(){
  const name=S.newName.trim();
  if(!name){S.newNameErr='Ingresá un nombre.';render();return;}
  if(S.parts.find(p=>p.name.toLowerCase()===name.toLowerCase())){
    S.newNameErr='Ya existe un participante con ese nombre.';render();return;
  }
  const code=generateCode();
  S.newNameErr='';S.saving=true;render();
  try{
    const part={name,code,hasProde:false,createdAt:new Date().toISOString()};
    await db.doc('participants/'+code).set(part);
    S.parts.push(part);
    S.newName='';
    S.newNameMsg='✓ '+name+' agregado · Código: '+code;
    setTimeout(()=>{S.newNameMsg='';render();},10000);
  }catch(e){S.newNameErr='Error al guardar. Intentá de nuevo.';}
  S.saving=false;render();
}

async function deleteProde(code,name){
  if(!confirm('¿Borrar el pronóstico de '+name+'?')) return;
  try{
    await db.doc('predictions/'+code).delete();
    await db.doc('participants/'+code).update({hasProde:false,submittedAt:null});
    const idx=S.parts.findIndex(p=>p.code===code);
    if(idx>=0) S.parts[idx].hasProde=false;
    render();
  }catch(e){alert('Error al borrar.');}
}

async function deleteParticipant(code,name){
  if(!confirm('¿Eliminar a '+name+' y su prode?')) return;
  try{
    await db.doc('participants/'+code).delete();
    await db.doc('predictions/'+code).delete().catch(()=>{});
    S.parts=S.parts.filter(p=>p.code!==code);
    render();
  }catch(e){alert('Error al eliminar.');}
}

function upRes(id,field,val){
  if(!S.lr.gm) S.lr.gm={};
  if(!S.lr.gm[id]) S.lr.gm[id]={};
  S.lr.gm[id][field]=val===''?null:Number(val);
  const h=parseInt(S.lr.gm[id].hg),a=parseInt(S.lr.gm[id].ag);
  S.lr.gm[id].r=(!isNaN(h)&&!isNaN(a))?(h>a?'1':h<a?'2':'X'):null;
  const badge=document.getElementById('badge_'+id);
  if(badge) badge.textContent=S.lr.gm[id].r||'';
}

function setKOAdmin(id,field,val){
  if(!S.lr.ko) S.lr.ko={};
  if(!S.lr.ko[id]) S.lr.ko[id]={};
  if(field==='hg'||field==='ag') S.lr.ko[id][field]=val===''?null:Number(val);
  else S.lr.ko[id][field]=val;
}

  if(S.saving) return;

  }catch(e){S.adminMsg='Error al guardar. Revisá la conexión.';}
  S.saving=false;
  setTimeout(()=>{S.adminMsg='';render();},3000);
  render();
}

function calcBreakdown(pred, res) {
  const items = [];
  let gCorrect=0, gExact=0;
  GROUPS.forEach(g => PAIRS.forEach(([,],mi) => {
    const id=g+'_'+mi, p=pred?.gm?.[id], r=(res?.gm||{})[id];
    if(!p?.r||!r?.r) return;
    const hg=parseInt(p.hg),ag=parseInt(p.ag);
    if(!isNaN(hg)&&!isNaN(ag)&&hg===parseInt(r.hg)&&ag===parseInt(r.ag)) gExact++;
    else if(p.r===r.r) gCorrect++;
  }));
  if(gExact>0) items.push({label:'Marcador exacto x'+gExact, pts:gExact*5});
  if(gCorrect>0) items.push({label:'Resultado correcto x'+gCorrect, pts:gCorrect*2});

  let koCorrect=0, koExact=0;
  const bracket=buildKOBracket(res?.gm||{},res?.ko||{});
  Object.values(bracket).forEach(bm => {
    const pk=pred?.ko?.[bm.id], rk=(res?.ko||{})[bm.id];
    if(!pk||!rk||!rk.w) return;
    if(pk.hg!==undefined&&pk.ag!==undefined&&rk.hg!==undefined&&rk.ag!==undefined&&
       parseInt(pk.hg)===parseInt(rk.hg)&&parseInt(pk.ag)===parseInt(rk.ag)) koExact++;
    else if(pk.w&&pk.w===rk.w) koCorrect++;
  });
  if(koExact>0) items.push({label:'KO marcador x'+koExact, pts:koExact*5});
  if(koCorrect>0) items.push({label:'KO ganador x'+koCorrect, pts:koCorrect*2});

  const fp=pred?.fin||{}, rf=res?.finals||{};
  const eq=(a,b)=>a&&b&&a.trim().toLowerCase()===b.trim().toLowerCase();
  if(eq(fp.ch,rf.ch)) items.push({label:'Campeón',pts:10});
  if(eq(fp.ru,rf.ru)) items.push({label:'Subcampeón',pts:6});
  if(eq(fp.tp,rf.tp)) items.push({label:'3° Puesto',pts:4});
  if(eq(fp.fp,rf.fp)) items.push({label:'4° Puesto',pts:2});
  if(eq(fp.ts,rf.ts)) items.push({label:'Goleador',pts:8});
  if(eq(fp.bp,rf.bp)) items.push({label:'MVP',pts:5});
  if(eq(fp.as,rf.as)) items.push({label:'Goleador ARG',pts:5});
  if(rf.mg!==undefined&&rf.mg!==''&&fp.mg!==''&&fp.mg!==undefined){
    const d=Math.abs(parseInt(fp.mg)-parseInt(rf.mg));
    if(d===0) items.push({label:'Goles Messi exacto',pts:5});
    else if(d<=2) items.push({label:'Goles Messi ±2',pts:2});
  }
  if(items.length===0) items.push({label:'Sin aciertos aún',pts:0});
  return items;
}

function activateTest() {
  S._testActive = true;
  render();
}

function deactivateTest() {
  S._testActive = false;
  render();
}

async function init(){
  try{
    const[setupDoc,partsSnap,resDoc]=await Promise.all([
      db.doc('config/setup').get(),
      db.collection('participants').get(),
      db.doc('results/official').get()
    ]);
    S.setup=setupDoc.exists?setupDoc.data():SETUP_DEFAULT;
    S.parts=partsSnap.docs.map(d=>d.data());
    const rd=resDoc.exists?resDoc.data():{};
    if(!rd.gm) rd.gm={};
    if(!rd.ko) rd.ko={};
    if(!rd.finals) rd.finals={};
    S.res=rd;
  }catch(e){
    app.innerHTML=`
      <div class="page" style="text-align:center;padding-top:60px">
        <div style="font-size:40px;margin-bottom:16px">⚠️</div>
        <h2 style="margin-bottom:8px">Error de conexión</h2>
        <p>Verificá la configuración de Firebase y las reglas de Firestore.</p>
      </div>`;
    return;
  }
  render();
}
init();
</script>
